(()=>{const $=x=>document.getElementById(x),D={name:'Arun4ever',taglines:['Creative Web Developer'],bio:'Welcome to my corner of the internet. I enjoy creating thoughtful websites, animations and digital experiences.',mood:'Creative',moodEmoji:'😎',location:'Ahmedabad, India 🇮🇳',avatar:'',banner:'',music:'',skills:'HTML, CSS, JavaScript, Firebase, Web Design',socials:{pinterest:'',instagram:'',github:'',youtube:'',whatsapp:'',telegram:'',twitter:'',email:'',website:''}},I={pinterest:['fa-brands fa-pinterest','Pinterest'],instagram:['fa-brands fa-instagram','Instagram'],github:['fa-brands fa-github','GitHub'],youtube:['fa-brands fa-youtube','YouTube'],whatsapp:['fa-brands fa-whatsapp','WhatsApp'],telegram:['fa-brands fa-telegram','Telegram'],twitter:['fa-brands fa-x-twitter','X / Twitter'],email:['fa-solid fa-envelope','Email'],website:['fa-solid fa-globe','Website']};let esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),url=x=>/^https?:\/\//i.test(x)?x:'https://'+x,go=(k,x)=>k==='email'?'mailto:'+x:k==='whatsapp'&&/^\+?\d[\d -]+$/.test(x)?'https://wa.me/'+x.replace(/\D/g,''):url(x);function render(v){let p=Object.assign({},D,v||{});p.socials=Object.assign({},D.socials,(v&&v.socials)||{});document.title=p.name+' | Profile';$('name').textContent=p.name;$('letter').textContent=(p.name.trim()[0]||'A').toUpperCase();$('tagline').textContent=(Array.isArray(p.taglines)&&p.taglines[0])||'Creative Web Developer';if(p.avatar){$('avatarImg').src=p.avatar;$('avatar').classList.add('has-img')}else $('avatar').classList.remove('has-img');if(p.banner){$('bannerImg').src=p.banner;$('bannerImg').classList.remove('hide');$('fallback').classList.add('hide')}else{$('bannerImg').classList.add('hide');$('fallback').classList.remove('hide')}$('mood').textContent=((p.moodEmoji||'')+' '+(p.mood||'')).trim()||'😎 Creative';$('location').textContent='📍 '+(p.location||'Somewhere on Earth');$('bio').textContent=p.bio||'';$('skills').innerHTML=String(p.skills||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>'<span class="skill">'+esc(x)+'</span>').join('');let h='';Object.keys(I).forEach(k=>{let x=String(p.socials[k]||'').trim();if(!x)return;let a=I[k];h+='<a class="social" href="'+esc(go(k,x))+'" target="_blank" rel="noopener"><i class="'+a[0]+'"></i><span>'+a[1]+'</span></a>'});$('socials').innerHTML=h;let pin=String(p.socials.pinterest||'').trim();if(pin){$('pin').href=url(pin);$('pin').classList.add('show')}else $('pin').classList.remove('show');if(p.music){$('audio').src=p.music;$('music').classList.remove('hide')}else $('music').classList.add('hide')}let play=false;$('music').onclick=()=>{let a=$('audio');play?a.pause():a.play().catch(()=>{});play=!play};if(window.IS_CONFIGURED&&window.firebase)firebase.database().ref('profile').on('value',s=>render(s.val()),()=>render(null));else render(null)})();
