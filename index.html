<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arun4ever | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --paper:#f7f5f0;
      --ink:#171513;
      --line:#dedad1;
      --muted:#77736c;
      --accent:#b18a4e;
      --card:#fffdf9;
      --shadow:rgba(46,35,21,.10);
    }

    body{
      background:var(--paper);
      color:var(--ink);
      font-family:Poppins,sans-serif;
    }

    body.theme-default{
      --paper:#101116;
      --ink:#f3f1e9;
      --line:#30313a;
      --muted:#aaa9b1;
      --accent:#8297ff;
      --card:#191a20;
      --shadow:rgba(0,0,0,.25);
    }

    .hide{display:none!important}

    .loader{
      position:fixed;
      z-index:100;
      inset:0;
      display:grid;
      place-items:center;
      background:var(--paper);
      transition:opacity .35s ease;
    }

    .loader.done{
      opacity:0;
      pointer-events:none;
    }

    .loader-text{
      color:var(--muted);
      font-size:11px;
      letter-spacing:1px;
    }

    .dot{
      display:inline-block;
      width:6px;
      height:6px;
      margin-left:6px;
      border-radius:50%;
      background:var(--accent);
      animation:pulse .9s infinite alternate;
    }

    @keyframes pulse{
      to{transform:scale(1.8);opacity:.3}
    }

    .page{
      width:min(1160px,100%);
      margin:36px auto;
      padding:0 20px;
      display:grid;
      grid-template-columns:390px minmax(0,1fr);
      gap:42px;
      align-items:start;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--card);
      box-shadow:0 14px 35px var(--shadow);
      overflow:visible;
    }

    .banner{
      overflow:hidden;
      border-radius:9px 9px 0 0;
      line-height:0;
      background:#392a35;
    }

    .banner-img{
      display:block;
      width:100%;
      height:auto;
      max-width:100%;
      object-fit:contain;
    }

    .fallback{
      height:130px;
      background:linear-gradient(120deg,#23162b,#684633 48%,#153c40);
    }

    .head{
      display:flex;
      align-items:flex-end;
      gap:12px;
      min-height:130px;
      padding:0 16px 15px;
    }

    .avatar{
      width:118px;
      height:118px;
      flex:none;
      margin-top:-59px;
      overflow:hidden;
      border:4px solid #fff;
      border-radius:50%;
      background:#37244d;
      box-shadow:0 13px 27px rgba(0,0,0,.26);
    }

    .avatar img{
      display:none;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .avatar.has-img img{
      display:block;
    }

    .avatar.has-img .letter{
      display:none;
    }

    .letter{
      display:grid;
      width:100%;
      height:100%;
      place-items:center;
      color:#fff7ec;
      font:700 60px "Cormorant Garamond",serif;
    }

    .identity{min-width:0}

    .name{
      font:700 35px/.9 "Cormorant Garamond",serif;
    }

    .tagline{
      margin-top:7px;
      color:var(--muted);
      font-size:10px;
    }

    .meta{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    .pill{
      padding:5px 8px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      font-size:8px;
      white-space:nowrap;
    }

    .content{
      min-height:500px;
      padding:23px 17px;
      border-top:1px solid var(--line);
    }

    .label{
      margin-bottom:9px;
      color:var(--accent);
      font-size:8px;
      font-weight:700;
      letter-spacing:1.8px;
      text-transform:uppercase;
    }

    .bio{
      font:600 23px/1.35 "Cormorant Garamond",serif;
      white-space:pre-line;
    }

    .bar{
      width:35px;
      height:2px;
      margin:15px 0;
      background:var(--accent);
    }

    .detail{
      color:var(--muted);
      font-size:11px;
      line-height:1.75;
      white-space:pre-line;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:18px;
    }

    .skill{
      padding:5px 8px;
      border:1px solid var(--line);
      border-radius:4px;
      color:var(--muted);
      font-size:9px;
    }

    .right-title{
      font:700 35px/1 "Cormorant Garamond",serif;
    }

    .right-sub{
      max-width:540px;
      margin:9px 0 23px;
      color:var(--muted);
      font-size:12px;
      line-height:1.75;
      white-space:pre-line;
    }

    .works{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .work{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:9px;
      background:var(--card);
      transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;
    }

    .work-img{
      display:block;
      width:100%;
      height:auto;
      max-width:100%;
      object-fit:contain;
      background:transparent;
      transition:transform .35s ease,filter .35s ease;
    }

    .work-body{
      padding:13px;
    }

    .work-title{
      font:700 21px/1 "Cormorant Garamond",serif;
    }

    .work-caption{
      min-height:34px;
      margin:7px 0 12px;
      color:var(--muted);
      font-size:10px;
      line-height:1.65;
      white-space:pre-line;
    }

    .work-link{
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--accent);
      font-size:10px;
      font-weight:600;
      text-decoration:none;
    }

    .work-link i{
      transition:transform .25s ease;
    }

    .work:hover{
      transform:translateY(-6px);
      border-color:var(--accent);
      box-shadow:0 16px 30px var(--shadow);
    }

    .work:hover .work-img{
      filter:brightness(1.04);
    }

    .work:hover .work-link i{
      transform:translate(2px,-2px);
    }

    .work:active{
      transform:translateY(-1px) scale(.985);
      box-shadow:0 6px 14px var(--shadow);
    }

    .work:active .work-img{
      transform:scale(.985);
      filter:brightness(.96);
    }

    .empty{
      padding:38px 15px;
      border:1px dashed var(--line);
      border-radius:9px;
      color:var(--muted);
      font-size:11px;
      text-align:center;
    }

    .social-title{
      margin-top:30px;
    }

    .custom-title{
      margin-top:22px;
    }

    .socials{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .social{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:6px;
      color:var(--muted);
      font-size:10px;
      text-decoration:none;
      transition:.2s ease;
    }

    .social:hover{
      transform:translateY(-2px);
      border-color:var(--accent);
      color:var(--accent);
    }

    .music{
      position:fixed;
      z-index:5;
      right:18px;
      bottom:18px;
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#19171b;
      color:#fff;
      cursor:pointer;
      font-size:16px;
      box-shadow:0 8px 22px rgba(0,0,0,.25);
    }

    .music.playing{
      animation:spin 3s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    @media(max-width:760px){
      .page{
        grid-template-columns:minmax(0,390px);
        justify-content:center;
        gap:28px;
        padding:0 12px;
      }

      .works{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:390px){
      .page{padding:0 9px}
      .avatar{
        width:101px;
        height:101px;
        margin-top:-51px;
      }

      .head{min-height:137px}
      .name{font-size:30px}
      .bio{font-size:21px}
    }
  </style>
</head>

<body class="theme-classic">

  <div id="loader" class="loader">
    <div class="loader-text">
      Loading profile<span class="dot"></span>
    </div>
  </div>

  <main class="page">

    <section class="panel">

      <div class="banner">
        <img id="bannerImg" class="banner-img hide" alt="Profile banner">
        <div id="fallback" class="fallback"></div>
      </div>

      <div class="head">

        <div id="avatar" class="avatar">
          <img id="avatarImg" alt="Profile picture" referrerpolicy="no-referrer">
          <div id="letter" class="letter">A</div>
        </div>

        <div class="identity">
          <h1 id="name" class="name">Loading…</h1>
          <p id="tagline" class="tagline"></p>

          <div class="meta">
            <span id="mood" class="pill"></span>
            <span id="location" class="pill"></span>
          </div>
        </div>

      </div>

      <div class="content">
        <div class="label">About me</div>
        <p id="bio" class="bio"></p>

        <div class="bar"></div>

        <p id="profileText" class="detail"></p>

        <div id="skills" class="skills"></div>
      </div>

    </section>

    <section class="right">

      <h2 id="workTitle" class="right-title">My work</h2>
      <p id="workText" class="right-sub"></p>

      <div id="works" class="works"></div>

      <div id="socialWrap" class="hide">
        <div class="label social-title">Find me online</div>
        <div id="socials" class="socials"></div>
      </div>

      <div id="customWrap" class="hide">
        <div class="label custom-title">More links</div>
        <div id="customLinks" class="socials"></div>
      </div>

    </section>

  </main>

  <button id="music" class="music hide" type="button" aria-label="Play music">
    ♪
  </button>

  <audio id="audio" loop preload="none"></audio>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      const defaults = {
        name: "Arun4ever",
        tagline: "Creative Web Developer",
        bio: "Welcome to my corner of the internet.",
        profileText: "A personal space for ideas, creative work, and everything I am building.",
        workTitle: "Selected work",
        workText: "A few ideas and projects I have created.",
        theme: "classic",
        mood: "Creative",
        moodEmoji: "😎",
        location: "Ahmedabad, India 🇮🇳",
        avatar: "",
        banner: "",
        music: "",
        skills: "HTML, CSS, JavaScript, Firebase",
        works: [],
        socials: {},
        customLinks: []
      };

      const icons = {
        pinterest: ["fa-brands fa-pinterest", "Pinterest"],
        instagram: ["fa-brands fa-instagram", "Instagram"],
        facebook: ["fa-brands fa-facebook-f", "Facebook"],
        linkedin: ["fa-brands fa-linkedin-in", "LinkedIn"],
        snapchat: ["fa-brands fa-snapchat", "Snapchat"],
        tiktok: ["fa-brands fa-tiktok", "TikTok"],
        github: ["fa-brands fa-github", "GitHub"],
        youtube: ["fa-brands fa-youtube", "YouTube"],
        discord: ["fa-brands fa-discord", "Discord"],
        telegram: ["fa-brands fa-telegram", "Telegram"],
        twitter: ["fa-brands fa-x-twitter", "X"],
        threads: ["fa-brands fa-threads", "Threads"],
        whatsapp: ["fa-brands fa-whatsapp", "WhatsApp"],
        spotify: ["fa-brands fa-spotify", "Spotify"],
        reddit: ["fa-brands fa-reddit-alien", "Reddit"],
        email: ["fa-solid fa-envelope", "Email"],
        website: ["fa-solid fa-globe", "Website"],
        other: ["fa-solid fa-link", "Link"]
      };

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"]/g, char => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;"
          }[char];
        });
      }

      function safeURL(value) {
        const url = String(value || "").trim();

        if (!url) return "";

        if (/^https?:\/\//i.test(url)) {
          return url;
        }

        return "https://" + url;
      }

      function socialURL(platform, value) {
        const link = String(value || "").trim();

        if (platform === "email") {
          return "mailto:" + link;
        }

        if (
          platform === "whatsapp" &&
          /^\+?\d[\d -]+$/.test(link)
        ) {
          return "https://wa.me/" + link.replace(/\D/g, "");
        }

        return safeURL(link);
      }

      function setAvatar(url) {
        const avatar = $("avatar");
        const image = $("avatarImg");

        if (!url) {
          avatar.classList.remove("has-img");
          image.removeAttribute("src");
          return;
        }

        /*
          Show the image container immediately.
          If the URL is invalid, onerror returns to the letter avatar.
        */
        avatar.classList.add("has-img");

        image.onerror = () => {
          avatar.classList.remove("has-img");
          image.removeAttribute("src");
        };

        image.src = safeURL(url);
      }

      function setBanner(url) {
        const image = $("bannerImg");
        const fallback = $("fallback");

        if (!url) {
          image.classList.add("hide");
          fallback.classList.remove("hide");
          image.removeAttribute("src");
          return;
        }

        image.onload = () => {
          image.classList.remove("hide");
          fallback.classList.add("hide");
        };

        image.onerror = () => {
          image.classList.add("hide");
          fallback.classList.remove("hide");
          image.removeAttribute("src");
        };

        image.src = safeURL(url);
      }

      function render(profileData) {
        const profile = Object.assign({}, defaults, profileData || {});
        const socials = Object.assign(
          {},
          defaults.socials,
          (profileData && profileData.socials) || {}
        );

        document.body.className =
          "theme-" + (profile.theme === "default" ? "default" : "classic");

        $("name").textContent = profile.name || defaults.name;

        $("tagline").textContent =
          (Array.isArray(profile.taglines) && profile.taglines[0]) ||
          profile.tagline ||
          defaults.tagline;

        $("letter").textContent =
          (profile.name || defaults.name).trim().charAt(0).toUpperCase() || "A";

        $("mood").textContent =
          ((profile.moodEmoji || "") + " " + (profile.mood || "")).trim();

        $("location").textContent =
          profile.location ? "📍 " + profile.location : "";

        $("bio").textContent = profile.bio || "";
        $("profileText").textContent = profile.profileText || "";
        $("workTitle").textContent = profile.workTitle || defaults.workTitle;
        $("workText").textContent = profile.workText || defaults.workText;

        setAvatar(profile.avatar);
        setBanner(profile.banner);

        $("skills").innerHTML = String(profile.skills || "")
          .split(",")
          .map(skill => skill.trim())
          .filter(Boolean)
          .map(skill => `<span class="skill">${escapeHTML(skill)}</span>`)
          .join("");

        const works = Array.isArray(profile.works) ? profile.works : [];

        const workCards = works
          .filter(work => work && work.title)
          .map(work => {
            const image = work.image
              ? `<img class="work-img" loading="lazy" referrerpolicy="no-referrer"
                   src="${escapeHTML(safeURL(work.image))}"
                   alt="${escapeHTML(work.title)}">`
              : "";

            const link = work.link
              ? `<a class="work-link"
                   href="${escapeHTML(safeURL(work.link))}"
                   target="_blank"
                   rel="noopener">
                   View project
                   <i class="fa-solid fa-arrow-up-right-from-square"></i>
                 </a>`
              : "";

            return `
              <article class="work">
                ${image}
                <div class="work-body">
                  <h3 class="work-title">${escapeHTML(work.title)}</h3>
                  <p class="work-caption">${escapeHTML(work.caption || "")}</p>
                  ${link}
                </div>
              </article>
            `;
          })
          .join("");

        $("works").innerHTML =
          workCards ||
          `<div class="empty">
            Work cards will appear here after they are added from the admin panel.
          </div>`;

        let socialHTML = "";

        Object.entries(icons).forEach(([platform, details]) => {
          const value = String(socials[platform] || "").trim();

          if (!value) return;

          socialHTML += `
            <a class="social"
               href="${escapeHTML(socialURL(platform, value))}"
               target="_blank"
               rel="noopener">
              <i class="${details[0]}"></i>
              ${details[1]}
            </a>
          `;
        });

        $("socials").innerHTML = socialHTML;
        $("socialWrap").classList.toggle("hide", !socialHTML);

        const customLinks = Array.isArray(profile.customLinks)
          ? profile.customLinks
          : [];

        const customHTML = customLinks
          .filter(item => item && item.label && item.url)
          .map(item => `
            <a class="social"
               href="${escapeHTML(safeURL(item.url))}"
               target="_blank"
               rel="noopener">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              ${escapeHTML(item.label)}
            </a>
          `)
          .join("");

        $("customLinks").innerHTML = customHTML;
        $("customWrap").classList.toggle("hide", !customHTML);

        const musicButton = $("music");
        const audio = $("audio");

        if (profile.music) {
          audio.src = safeURL(profile.music);
          musicButton.classList.remove("hide");
        } else {
          audio.pause();
          audio.removeAttribute("src");
          musicButton.classList.add("hide");
          musicButton.classList.remove("playing");
        }

        $("loader").classList.add("done");
      }

      let playing = false;

      $("music").addEventListener("click", () => {
        const audio = $("audio");
        const musicButton = $("music");

        if (playing) {
          audio.pause();
          playing = false;
          musicButton.classList.remove("playing");
          return;
        }

        audio.play()
          .then(() => {
            playing = true;
            musicButton.classList.add("playing");
          })
          .catch(() => {});
      });

      try {
        if (!window.firebase || !firebase.apps || !firebase.apps.length) {
          throw new Error("Firebase is not initialized.");
        }

        firebase.database().ref("profile").on(
          "value",
          snapshot => {
            render(snapshot.val());
          },
          error => {
            console.error(error);
            render(null);
          }
        );
      } catch (error) {
        console.error(error);
        render(null);
      }
    })();
  </script>

</body>
</html>
