<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b0b10"><title>Arun4ever | Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#101016;--paper:#f7f5f0;--soft:#e9e6dd;--muted:#77736c;--gold:#b18a4e;--glass:rgba(10,10,14,.36)}html{scroll-behavior:smooth}body{font-family:Poppins,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}.hide{display:none!important}
/* Long profile cover */
.cover{height:360px;position:relative;overflow:hidden;background:linear-gradient(125deg,#2d2118,#73502a 47%,#17120f)}.cover-img{height:100%;width:100%;object-fit:cover;display:block;animation:coverMove 35s ease-in-out infinite alternate}@keyframes coverMove{to{transform:scale(1.045) translate(-.7%,.5%)}}.cover-fallback{position:absolute;inset:0;background:linear-gradient(118deg,#201626,#4d3724 48%,#0e282d)}.cover-fallback:before,.cover-fallback:after{position:absolute;content:'';border-radius:50%;filter:blur(80px);opacity:.7}.cover-fallback:before{height:350px;width:350px;top:-150px;left:13%;background:#b78744}.cover-fallback:after{height:330px;width:330px;bottom:-180px;right:12%;background:#226771}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.17),rgba(0,0,0,.05) 45%,rgba(0,0,0,.70))}.cover-noise{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(rgba(255,255,255,.8) .7px,transparent .8px);background-size:7px 7px;mix-blend-mode:soft-light}
.nav{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:25px max(28px,calc((100vw - 1160px)/2));color:#fff}.brand{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 10px #000}.nav-dot{height:9px;width:9px;border:1px solid rgba(255,255,255,.8);border-radius:50%;box-shadow:0 0 12px rgba(255,255,255,.8)}
.profile-head{max-width:1120px;margin:auto;min-height:128px;display:flex;align-items:flex-end;gap:24px;padding:0 28px 22px;position:relative}.avatar-wrap{width:150px;height:150px;flex:none;position:relative;margin-top:-78px;z-index:5;perspective:700px}.avatar-float{width:100%;height:100%;border-radius:50%;animation:avatarFloat 5s ease-in-out infinite;transform-style:preserve-3d;cursor:pointer}@keyframes avatarFloat{0%,100%{transform:translateY(0) rotateY(0deg)}50%{transform:translateY(-7px) rotateY(7deg)}}.avatar{height:100%;width:100%;overflow:hidden;border:4px solid var(--paper);border-radius:50%;background:linear-gradient(135deg,#37244d,#1e6670);box-shadow:0 17px 35px rgba(0,0,0,.28),inset 0 0 0 3px rgba(0,0,0,.13)}.avatar img{width:100%;height:100%;object-fit:cover;display:none}.avatar-letter{height:100%;display:grid;place-items:center;color:#fff7ec;font:700 74px 'Cormorant Garamond',serif}.has-img img{display:block}.has-img .avatar-letter{display:none}.online{position:absolute;right:9px;bottom:8px;width:18px;height:18px;border:3px solid var(--paper);border-radius:50%;background:#54d587;box-shadow:0 0 13px rgba(84,213,135,.8)}.flip{animation:flip .8s cubic-bezier(.6,.05,.3,1)!important}@keyframes flip{to{transform:rotateY(360deg)}}
.identity{padding-bottom:1px;min-width:0}.name{font:700 45px/.9 'Cormorant Garamond',Georgia,serif;letter-spacing:.6px;color:#1b1918}.tagline{min-height:22px;margin-top:8px;color:var(--muted);font-size:13px}.caret{display:inline-block;height:16px;width:1px;margin-left:4px;background:var(--gold);vertical-align:-3px;animation:blink .8s step-end infinite}@keyframes blink{50%{opacity:0}}.head-right{margin-left:auto;padding-bottom:4px;display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid #dedad1;border-radius:999px;background:#fffdf9;color:#5d5850;font-size:12px;white-space:nowrap}
.line{height:1px;background:#dedad1;max-width:1120px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.75fr);gap:52px;max-width:1120px;margin:auto;padding:42px 28px 70px}.section{margin-bottom:36px}.label{margin-bottom:11px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase}.about{font-family:'Cormorant Garamond',Georgia,serif;font-size:29px;line-height:1.34;color:#25211e;white-space:pre-line;max-width:690px}.quote-line{height:2px;width:46px;background:var(--gold);margin:19px 0}.details{color:#77736c;font-size:13.5px;line-height:1.85;white-space:pre-line}.skill-list{display:flex;flex-wrap:wrap;gap:9px}.skill{padding:8px 13px;border:1px solid #dedad1;border-radius:4px;background:#faf8f3;color:#504b45;font-size:12px;transition:.25s}.skill:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 7px 15px rgba(78,59,34,.1)}
.side{border-left:1px solid #dedad1;padding-left:36px}.social-list{display:flex;flex-direction:column;gap:8px}.social{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid transparent;border-radius:7px;color:#4c4842;text-decoration:none;font-size:13px;transition:.2s}.social i{width:18px;text-align:center;font-size:17px;color:var(--gold)}.social:hover{border-color:#dedad1;background:#fffdf9;transform:translateX(4px)}.pin{display:none;align-items:center;justify-content:center;gap:10px;margin-top:23px;width:100%;padding:13px 16px;border-radius:6px;background:#b7192f;color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:.25s}.pin.show{display:flex}.pin:hover{background:#991025;transform:translateY(-2px);box-shadow:0 10px 20px rgba(183,25,47,.2)}.music{position:fixed;z-index:20;right:20px;bottom:20px;height:48px;width:48px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:#19171b;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.2);cursor:pointer;font-size:19px}.music.play{animation:music .9s ease-in-out infinite}@keyframes music{50%{transform:scale(1.12)}}
@media(max-width:760px){.cover{height:275px}.nav{padding:20px}.profile-head{padding:0 20px 21px;gap:15px;min-height:142px;align-items:flex-end}.avatar-wrap{height:112px;width:112px;margin-top:-53px}.avatar-letter{font-size:58px}.online{right:4px;bottom:4px}.name{font-size:37px}.head-right{position:absolute;left:20px;top:104px;margin:0;padding:0;justify-content:flex-start}.identity{padding-bottom:0}.tagline{font-size:12px}.layout{grid-template-columns:1fr;gap:0;padding:35px 20px 55px}.side{border-left:0;border-top:1px solid #dedad1;padding:29px 0 0}.about{font-size:26px}.nav-dot{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="cover"><img id="bannerImg" class="cover-img hide" alt="Profile banner"><div id="fallback" class="cover-fallback"></div><div class="shade"></div><div class="cover-noise"></div><nav class="nav"><div class="brand">Arun4ever</div><div class="nav-dot"></div></nav></header>
<section class="profile-head"><div class="avatar-wrap"><div class="avatar-float" id="avatarFloat"><div class="avatar" id="avatar"><img id="avatarImg" alt="Profile picture"><div class="avatar-letter" id="letter">A</div></div></div><span class="online"></span></div><div class="identity"><h1 class="name" id="name">Arun4ever</h1><div class="tagline"><span id="type"></span><span class="caret"></span></div></div><div class="head-right"><span class="pill" id="mood">😎 Creative</span><span class="pill" id="location">📍 Ahmedabad, India</span></div></section>
<div class="line"></div>
<main class="layout"><section><div class="section"><div class="label">A little introduction</div><p class="about" id="bio"></p><div class="quote-line"></div><p class="details">A personal space for ideas, creative work, and everything I am building.</p></div><div class="section"><div class="label">What I work with</div><div class="skill-list" id="skills"></div></div></section><aside class="side"><div class="label">Find me online</div><div class="social-list" id="socials"></div><a id="pin" class="pin" target="_blank" rel="noopener"><i class="fa-brands fa-pinterest"></i> Follow on Pinterest</a></aside></main>
<button id="music" class="music hide" title="Play background music">♪</button><audio id="audio" loop preload="none"></audio>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),d={name:'Arun4ever',taglines:['Creative Web Developer','Building websites with style','A personal corner of the web'],bio:'Welcome to my corner of the internet. I enjoy creating thoughtful websites, animations and digital experiences.',mood:'Creative',moodEmoji:'😎',location:'Ahmedabad, India 🇮🇳',avatar:'',banner:'',music:'',skills:'HTML, CSS, JavaScript, Firebase, Web Design',socials:{pinterest:'',instagram:'',github:'',youtube:'',whatsapp:'',telegram:'',twitter:'',email:'',website:''}},socials={pinterest:['fa-brands fa-pinterest','Pinterest'],instagram:['fa-brands fa-instagram','Instagram'],github:['fa-brands fa-github','GitHub'],youtube:['fa-brands fa-youtube','YouTube'],whatsapp:['fa-brands fa-whatsapp','WhatsApp'],telegram:['fa-brands fa-telegram','Telegram'],twitter:['fa-brands fa-x-twitter','X / Twitter'],email:['fa-solid fa-envelope','Email'],website:['fa-solid fa-globe','Website']};let tags=d.taglines,ti=0,ci=0,erase=false,started=false;const safe=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),url=x=>/^https?:\/\//i.test(x)?x:'https://'+x,href=(k,x)=>k==='email'?'mailto:'+x:k==='whatsapp'&&/^\+?\d[\d -]+$/.test(x)?'https://wa.me/'+x.replace(/\D/g,''):url(x);function typing(){let w=String(tags[ti%tags.length]||'');if(!erase){ci++;$('type').textContent=w.slice(0,ci);if(ci>=w.length){erase=true;return setTimeout(typing,1700)}setTimeout(typing,70)}else{ci--;$('type').textContent=w.slice(0,ci);if(ci<=0){erase=false;ti++;return setTimeout(typing,350)}setTimeout(typing,34)}}function start(){if(!started){started=true;typing()}}function render(value){let p=Object.assign({},d,value||{});p.socials=Object.assign({},d.socials,(value&&value.socials)||{});tags=Array.isArray(p.taglines)&&p.taglines.length?p.taglines:d.taglines;document.title=p.name+' | Profile';$('name').textContent=p.name;$('letter').textContent=(p.name.trim()[0]||'A').toUpperCase();if(p.avatar){$('avatarImg').src=p.avatar;$('avatar').classList.add('has-img')}else $('avatar').classList.remove('has-img');if(p.banner){$('bannerImg').src=p.banner;$('bannerImg').classList.remove('hide');$('fallback').classList.add('hide')}else{$('bannerImg').classList.add('hide');$('fallback').classList.remove('hide')}$('mood').textContent=((p.moodEmoji||'')+' '+(p.mood||'')).trim()||'😎 Creative';$('location').textContent='📍 '+(p.location||'Somewhere on Earth');$('bio').textContent=p.bio||'';$('skills').innerHTML=String(p.skills||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>'<span class="skill">'+safe(x)+'</span>').join('');let h='';Object.keys(socials).forEach(k=>{let x=String(p.socials[k]||'').trim();if(!x)return;let a=socials[k];h+='<a class="social" href="'+safe(href(k,x))+'" target="_blank" rel="noopener"><i class="'+a[0]+'"></i><span>'+a[1]+'</span></a>'});$('socials').innerHTML=h;let pin=String(p.socials.pinterest||'').trim();if(pin){$('pin').href=url(pin);$('pin').classList.add('show')}else $('pin').classList.remove('show');if(p.music){$('audio').src=p.music;$('music').classList.remove('hide')}else $('music').classList.add('hide');start()}$('avatarFloat').onclick=function(){this.classList.remove('flip');void this.offsetWidth;this.classList.add('flip')};let play=false;$('music').onclick=()=>{let a=$('audio');play?a.pause():a.play().catch(()=>{});play=!play;$('music').classList.toggle('play',play)};if(window.IS_CONFIGURED&&window.firebase){firebase.database().ref('profile').on('value',s=>render(s.val()),()=>render(null))}else render(null)})();
</script>
