<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <title>Arun4ever | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f7f5f0;
      --ink: #171513;
      --line: #dedad1;
      --muted: #77736c;
      --gold: #b18a4e;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Poppins", sans-serif;
    }

    .hide { display: none !important; }

    /* Narrow profile panel, positioned close to the left side. */
    .page {
      width: 100%;
      margin: 28px 0;
      padding-left: 18px;
      display: grid;
      grid-template-columns: 440px 220px;
      gap: 29px;
      align-items: start;
    }

    .panel {
      position: relative;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fffdf9;
      box-shadow: 0 14px 35px rgba(46, 35, 21, 0.07);
    }

    /* GIF keeps natural proportions: no fixed height, crop, zoom, or blur filter. */
    .banner {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 8px 8px 0 0;
      background: #ede8df;
      line-height: 0;
    }

    .banner-img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
      image-rendering: auto;
      transform: translateZ(0);
    }

    .fallback {
      position: relative;
      height: 140px;
      overflow: hidden;
      background: linear-gradient(120deg, #23162b, #684633 48%, #153c40);
    }

    .fallback::before {
      content: "";
      position: absolute;
      top: -90px;
      left: 8%;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: #bd8d48;
      filter: blur(53px);
      opacity: 0.7;
    }

    .head {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      min-height: 138px;
      padding: 0 18px 17px;
    }

    .avatar {
      width: 128px;
      height: 128px;
      flex: none;
      margin-top: -55px;
      overflow: hidden;
      border: 5px solid #ffffff;
      border-radius: 50%;
      background: linear-gradient(135deg, #37244d, #1e6670);
      box-shadow: 0 15px 32px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    .avatar img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .letter {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      color: #fff7ec;
      font-family: "Cormorant Garamond", serif;
      font-size: 65px;
      font-weight: 700;
    }

    .has-img img { display: block; }
    .has-img .letter { display: none; }

    .identity { min-width: 0; padding-bottom: 2px; }

    .name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 38px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: 0.5px;
    }

    .tagline {
      margin-top: 7px;
      color: var(--muted);
      font-size: 10.5px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .pill {
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: #5d5850;
      font-size: 8.5px;
      white-space: nowrap;
    }

    .message-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 7px 11px;
      border: 1px solid #1d1a1b;
      border-radius: 999px;
      background: #1d1a1b;
      color: #ffffff;
      font-size: 9px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .message-btn:hover {
      transform: translateY(-2px);
      background: #39312c;
      box-shadow: 0 7px 14px rgba(29, 26, 27, 0.18);
    }

    /* Taller lower profile section. */
    .content {
      min-height: 530px;
      border-top: 1px solid var(--line);
      padding: 23px 17px 28px;
    }

    .label {
      margin-bottom: 9px;
      color: var(--gold);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1.9px;
      text-transform: uppercase;
    }

    .bio {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.36;
      white-space: pre-line;
    }

    .bar {
      width: 37px;
      height: 2px;
      margin: 15px 0;
      background: var(--gold);
    }

    .detail {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.75;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 20px;
    }

    .skill {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #faf8f3;
      color: #504b45;
      font-size: 9.5px;
    }

    .side { padding-top: 7px; }

    .side-title {
      margin-bottom: 7px;
      font-family: "Cormorant Garamond", serif;
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
    }

    .side-text {
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.7;
    }

    .rule {
      height: 1px;
      margin-bottom: 15px;
      background: var(--line);
    }

    .socials {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #4c4842;
      font-size: 10.5px;
      text-decoration: none;
    }

    .social i {
      width: 15px;
      color: var(--gold);
      font-size: 14px;
      text-align: center;
    }

    .social:hover {
      border-color: var(--line);
      background: #fffdf9;
    }

    .pin {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      background: #b7192f;
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 600;
      text-decoration: none;
    }

    .pin.show { display: flex; }

    .music {
      position: fixed;
      right: 17px;
      bottom: 17px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #19171b;
      color: #ffffff;
      cursor: pointer;
      font-size: 17px;
    }

    @media (max-width: 740px) {
      .page {
        grid-template-columns: 440px;
        gap: 25px;
      }
    }

    @media (max-width: 470px) {
      .page {
        grid-template-columns: 1fr;
        margin: 14px 0;
        padding: 0 10px;
      }

      .head {
        min-height: 146px;
        gap: 11px;
        padding: 0 14px 14px;
      }

      .avatar {
        width: 108px;
        height: 108px;
        margin-top: -46px;
        border-width: 4px;
      }

      .letter { font-size: 55px; }
      .name { font-size: 32px; }
      .tagline { font-size: 9.5px; }
      .meta { margin-top: 7px; }

      .content {
        min-height: 0;
        padding: 21px 15px 26px;
      }

      .bio { font-size: 22px; }
      .side { padding: 2px 7px; }
    }
  </style>
</head>
<body>

  <main class="page">

    <section class="panel">

      <div class="banner">
        <img id="bannerImg" class="banner-img hide" alt="Animated banner">
        <div id="fallback" class="fallback"></div>
      </div>

      <div class="head">

        <div id="avatar" class="avatar">
          <img id="avatarImg" alt="Profile picture">
          <div id="letter" class="letter">A</div>
        </div>

        <div class="identity">
          <h1 id="name" class="name">Arun4ever</h1>

          <p id="tagline" class="tagline">
            Creative Web Developer
          </p>

          <div class="meta">
            <span id="mood" class="pill">😎 Creative</span>
            <span id="location" class="pill">📍 Ahmedabad, India</span>
          </div>

          <a href="message.html" class="message-btn">
            <i class="fa-solid fa-message"></i>
            Message me
          </a>
        </div>

      </div>

      <div class="content">
        <div class="label">A little introduction</div>

        <p id="bio" class="bio"></p>

        <div class="bar"></div>

        <p class="detail">
          A personal space for ideas, creative work, and everything I am building.
        </p>

        <div id="skills" class="skills"></div>
      </div>

    </section>

    <aside class="side">
      <h2 class="side-title">Arun4ever</h2>

      <p class="side-text">
        Explore my work, ideas and social links.
      </p>

      <div class="rule"></div>

      <div class="label">Find me online</div>

      <div id="socials" class="socials"></div>

      <a id="pin" class="pin" target="_blank" rel="noopener">
        <i class="fa-brands fa-pinterest"></i>
        Follow on Pinterest
      </a>
    </aside>

  </main>

  <button id="music" class="music hide">♪</button>
  <audio id="audio" loop preload="none"></audio>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);

      const DEFAULTS = {
        name: "Arun4ever",
        taglines: ["Creative Web Developer"],
        bio: "Welcome to my corner of the internet. I enjoy creating thoughtful websites, animations and digital experiences.",
        mood: "Creative",
        moodEmoji: "😎",
        location: "Ahmedabad, India 🇮🇳",
        avatar: "",
        banner: "",
        music: "",
        skills: "HTML, CSS, JavaScript, Firebase, Web Design",

        socials: {
          pinterest: "",
          instagram: "",
          github: "",
          youtube: "",
          whatsapp: "",
          telegram: "",
          twitter: "",
          email: "",
          website: ""
        }
      };

      const SOCIALS = {
        pinterest: ["fa-brands fa-pinterest", "Pinterest"],
        instagram: ["fa-brands fa-instagram", "Instagram"],
        github: ["fa-brands fa-github", "GitHub"],
        youtube: ["fa-brands fa-youtube", "YouTube"],
        whatsapp: ["fa-brands fa-whatsapp", "WhatsApp"],
        telegram: ["fa-brands fa-telegram", "Telegram"],
        twitter: ["fa-brands fa-x-twitter", "X / Twitter"],
        email: ["fa-solid fa-envelope", "Email"],
        website: ["fa-solid fa-globe", "Website"]
      };

      function escapeHtml(value) {
        return String(value).replace(/[&<>\"]/g, (character) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;"
          }[character];
        });
      }

      function makeUrl(value) {
        return /^https?:\/\//i.test(value)
          ? value
          : "https://" + value;
      }

      function makeSocialUrl(type, value) {
        if (type === "email") {
          return "mailto:" + value;
        }

        if (type === "whatsapp" && /^\+?\d[\d -]+$/.test(value)) {
          return "https://wa.me/" + value.replace(/\D/g, "");
        }

        return makeUrl(value);
      }

      function renderProfile(value) {
        const profile = Object.assign({}, DEFAULTS, value || {});

        profile.socials = Object.assign(
          {},
          DEFAULTS.socials,
          (value && value.socials) || {}
        );

        document.title = profile.name + " | Profile";

        $("name").textContent = profile.name;
        $("letter").textContent = (profile.name.trim()[0] || "A").toUpperCase();

        $("tagline").textContent =
          (Array.isArray(profile.taglines) && profile.taglines[0])
            ? profile.taglines[0]
            : "Creative Web Developer";

        if (profile.avatar) {
          $("avatarImg").src = profile.avatar;
          $("avatar").classList.add("has-img");
        } else {
          $("avatar").classList.remove("has-img");
        }

        if (profile.banner) {
          $("bannerImg").src = profile.banner;
          $("bannerImg").classList.remove("hide");
          $("fallback").classList.add("hide");
        } else {
          $("bannerImg").classList.add("hide");
          $("fallback").classList.remove("hide");
        }

        $("mood").textContent =
          ((profile.moodEmoji || "") + " " + (profile.mood || "")).trim()
          || "😎 Creative";

        $("location").textContent =
          "📍 " + (profile.location || "Somewhere on Earth");

        $("bio").textContent = profile.bio || "";

        const skillList = String(profile.skills || "")
          .split(",")
          .map((skill) => skill.trim())
          .filter(Boolean);

        $("skills").innerHTML = skillList
          .map((skill) => `<span class="skill">${escapeHtml(skill)}</span>`)
          .join("");

        let socialHtml = "";

        Object.keys(SOCIALS).forEach((key) => {
          const value = String(profile.socials[key] || "").trim();

          if (!value) return;

          const social = SOCIALS[key];

          socialHtml += `
            <a
              class="social"
              href="${escapeHtml(makeSocialUrl(key, value))}"
              target="_blank"
              rel="noopener"
            >
              <i class="${social[0]}"></i>
              <span>${social[1]}</span>
            </a>
          `;
        });

        $("socials").innerHTML = socialHtml;

        const pinterest = String(profile.socials.pinterest || "").trim();

        if (pinterest) {
          $("pin").href = makeUrl(pinterest);
          $("pin").classList.add("show");
        } else {
          $("pin").classList.remove("show");
        }

        if (profile.music) {
          $("audio").src = profile.music;
          $("music").classList.remove("hide");
        } else {
          $("music").classList.add("hide");
        }
      }

      let isPlaying = false;

      $("music").addEventListener("click", () => {
        const audio = $("audio");

        if (isPlaying) {
          audio.pause();
        } else {
          audio.play().catch(() => {});
        }

        isPlaying = !isPlaying;
      });

      if (window.IS_CONFIGURED && window.firebase) {
        firebase.database().ref("profile").on(
          "value",
          (snapshot) => renderProfile(snapshot.val()),
          () => renderProfile(null)
        );
      } else {
        renderProfile(null);
      }
    })();
  </script>

</body>
</html>
