<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07070f">
<meta name="description" content="Arun4ever — creative 3D profile ✨">
<title>Arun4ever ✨ | My World</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c1:#8b5cf6;--c2:#06b6d4;--c3:#f472b6;--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.14);--text:#eef0ff;--muted:#a7abc9}
html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:#07070f;color:var(--text);min-height:100vh;overflow-x:hidden}
#bg3d{position:fixed;inset:0;z-index:0;display:block}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:1;pointer-events:none;animation:floaty 16s ease-in-out infinite}
.blob.b1{width:430px;height:430px;background:#7c3aed;top:-130px;left:-130px}
.blob.b2{width:380px;height:380px;background:#0891b2;bottom:-120px;right:-110px;animation-delay:-5s}
.blob.b3{width:300px;height:300px;background:#f472b6;top:38%;left:58%;animation-delay:-10s;opacity:.3}
@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,-45px) scale(1.15)}}
.float-emoji{position:fixed;z-index:1;font-size:24px;opacity:.55;pointer-events:none;animation:floaty 12s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(139,92,246,.6))}
.fe1{top:12%;left:6%}
.fe2{top:18%;right:8%;animation-delay:-3s;font-size:20px}
.fe3{bottom:16%;left:10%;animation-delay:-6s;font-size:22px}
.fe4{bottom:12%;right:6%;animation-delay:-9s}
@media(max-width:560px){.float-emoji{display:none}}
#loader{position:fixed;inset:0;z-index:100;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s ease,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
.loader-logo{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;letter-spacing:1px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(139,92,246,.55)}50%{transform:scale(1.06);box-shadow:0 0 0 28px rgba(139,92,246,0)}}
.loader-text{font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
.scene{position:relative;z-index:2;perspective:1400px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 16px 20px}
.card3d{position:relative;width:100%;max-width:470px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden;will-change:transform}
.glare{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
.banner{position:relative;height:160px;background:linear-gradient(120deg,#1b1035,#0b2030 45%,#2a0f2e);overflow:hidden}
.banner-img{width:100%;height:100%;object-fit:cover;animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.15) translate(14px,-10px)}}
.banner-blobs span{position:absolute;border-radius:50%;filter:blur(30px);opacity:.8;animation:blobmove 9s ease-in-out infinite}
.banner-blobs span:nth-child(1){width:150px;height:150px;background:var(--c1);top:-40px;left:10%}
.banner-blobs span:nth-child(2){width:120px;height:120px;background:var(--c2);bottom:-30px;right:15%;animation-delay:-3s}
.banner-blobs span:nth-child(3){width:90px;height:90px;background:var(--c3);top:20px;right:35%;animation-delay:-6s}
@keyframes blobmove{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,18px)}}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(7,7,15,.55))}
.avatar-zone{display:flex;justify-content:center;margin-top:-58px;position:relative;z-index:6}
.avatar-ring{position:relative;width:118px;height:118px;cursor:pointer}
.avatar-ring::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 4s linear infinite;z-index:1}
.avatar-ring::after{content:'';position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));filter:blur(20px);opacity:.45;z-index:0;animation:spin 4s linear infinite,glowpulse 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowpulse{0%,100%{opacity:.25}50%{opacity:.55}}
.avatar{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#12122a;border:4px solid #0b0b18;z-index:2}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.avatar .letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.avatar.has-img img{display:block}
.avatar.has-img .letter{display:none}
.online-dot{position:absolute;right:6px;bottom:8px;width:16px;height:16px;background:#22c55e;border-radius:50%;border:3px solid #0b0b18;z-index:3;animation:glowpulse 2s ease-in-out infinite}
.avatar-ring.spinme{animation:yeespin .85s cubic-bezier(.6,.05,.3,1)}
@keyframes yeespin{to{transform:rotateY(360deg)}}
.content{padding:18px 26px 26px;text-align:center;position:relative;z-index:6}
.name{font-size:34px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--c2),var(--c1),var(--c3),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.typing{min-height:26px;margin-top:6px;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.caret{width:2px;height:18px;background:var(--c2);display:inline-block;animation:blink .8s step-end infinite;margin-left:3px}
@keyframes blink{50%{opacity:0}}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 6px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:var(--glass);border:1px solid var(--border);font-size:13.5px;color:var(--muted)}
.pill.mood{color:#fff;border:none;background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(6,182,212,.4));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bio-box{position:relative;margin:16px 0 4px;padding:15px 16px 15px 20px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--border);text-align:left}
.bio-box::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(var(--c1),var(--c2))}
.bio-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--c2);margin-bottom:7px;font-weight:600}
.bio{font-size:13.5px;line-height:1.75;color:#cdd0e8;white-space:pre-line;word-break:break-word}
.skills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.chip{padding:7px 13px;font-size:12.5px;border-radius:999px;background:var(--glass);border:1px solid var(--border);color:#dfe2f7;animation:chipin .5s backwards;transition:.25s}
.chip:hover{transform:translateY(-3px);border-color:var(--c1);box-shadow:0 6px 16px rgba(139,92,246,.35)}
@keyframes chipin{from{opacity:0;transform:translateY(14px) scale(.85)}}
.socials{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0 6px}
.social-btn{width:47px;height:47px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);color:#fff;font-size:20px;text-decoration:none;transition:transform .25s,box-shadow .25s,border-color .25s}
.social-btn:hover{transform:translateY(-6px) scale(1.06);border-color:rgba(255,255,255,.35);box-shadow:0 12px 26px rgba(0,0,0,.45),0 0 20px var(--glow,rgba(139,92,246,.5))}
.pinterest-cta{display:none;margin:14px auto 4px;align-items:center;justify-content:center;gap:10px;width:fit-content;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,#e60023,#ff4d6d);color:#fff;text-decoration:none;font-size:14px;font-weight:600;box-shadow:0 10px 28px rgba(230,0,35,.4);transition:.25s}
.pinterest-cta.show{display:flex;animation:chipin .5s}
.pinterest-cta:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 34px rgba(230,0,35,.55)}
.stats-row{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stat b{color:#fff}
.actions{margin-top:16px}
.btn-share{padding:11px 22px;border-radius:999px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer;transition:.25s}
.btn-share:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.footer-note{margin-top:22px;font-size:12px;color:var(--muted);letter-spacing:1.5px;opacity:.8;text-align:center}
.music-btn{position:fixed;right:18px;bottom:18px;z-index:50;width:54px;height:54px;border-radius:50%;border:1px solid var(--border);background:rgba(20,20,40,.75);backdrop-filter:blur(10px);color:#fff;font-size:22px;cursor:pointer;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.music-btn:hover{transform:scale(1.1)}
.music-btn.playing{animation:beat 1s ease-in-out infinite;border-color:var(--c2);box-shadow:0 0 24px rgba(6,182,212,.5)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);z-index:60;padding:12px 22px;border-radius:999px;background:rgba(15,15,35,.9);border:1px solid var(--border);color:#fff;font-size:13.5px;opacity:0;transition:.35s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.hidden{display:none!important}
@media(max-width:430px){.name{font-size:28px}.content{padding:16px 18px 22px}.banner{height:135px}.avatar-ring{width:104px;height:104px}.avatar .letter{font-size:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="bg3d"></canvas>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="float-emoji fe1">💜</span><span class="float-emoji fe2">✨</span><span class="float-emoji fe3">🚀</span><span class="float-emoji fe4">⚡</span>

<div id="loader">
  <div class="loader-logo">A4</div>
  <div class="loader-text">Loading something epic…</div>
</div>

<div class="scene">
  <div class="card3d" id="tiltCard">
    <div class="glare" id="glare"></div>

    <div class="banner">
      <img id="bannerImg" class="banner-img hidden" alt="banner">
      <div class="banner-blobs" id="bannerBlobs"><span></span><span></span><span></span></div>
    </div>

    <div class="avatar-zone">
      <div class="avatar-ring" id="avatarRing" title="Click me 😉">
        <div class="avatar" id="avatarBox">
          <img id="avatarImg" alt="profile picture">
          <div class="letter" id="avatarLetter">A</div>
        </div>
        <span class="online-dot"></span>
      </div>
    </div>

    <div class="content">
      <h1 class="name" id="nameEl">Arun4ever</h1>
      <div class="typing"><span id="typeText"></span><span class="caret"></span></div>

      <div class="pills">
        <span class="pill mood" id="moodPill">😎 Creative</span>
        <span class="pill" id="locPill">📍 Location</span>
      </div>

      <div class="bio-box">
        <div class="bio-label">✦ About me</div>
        <p class="bio" id="bioEl"></p>
      </div>

      <div class="skills" id="skillsEl"></div>
      <div class="socials" id="socialsEl"></div>
      <a class="pinterest-cta" id="pinCta" target="_blank" rel="noopener"><i class="fa-brands fa-pinterest"></i> Follow me on Pinterest</a>

      <div class="stats-row">
        <span class="stat">👀 <b id="visitsEl">—</b> visits</span>
        <span class="stat">⚡ Live from my admin panel</span>
      </div>

      <div class="actions">
        <button class="btn-share" id="shareBtn">🔗 Share my profile</button>
      </div>
    </div>
  </div>
  <div class="footer-note">✦ ARUN4EVER ✦ FROM ANOTHER LEVEL ✦</div>
</div>

<button id="musicBtn" class="music-btn hidden" title="Play music">🎵</button>
<audio id="bgMusic" loop preload="none"></audio>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ============ DEFAULT DATA (shows until you save from admin panel) ============ */
var DEFAULTS = {
  name: 'Arun4ever',
  taglines: ['Creative Web Developer 💻','Building websites from another level ✨','Dream big. Build bigger 🚀'],
  bio: "Hey! I'm Arun 👋 Welcome to my little corner of the internet. I love making creative websites, animations and cool experiments on the web.\n\nThis whole page is controlled live from my own admin panel 🔥",
  mood: 'Creative',
  moodEmoji: '😎',
  location: 'Ahmedabad, India 🇮🇳',
  avatar: '',
  banner: '',
  music: '',
  skills: 'HTML, CSS, JavaScript, Firebase, Web Design, 3D Websites',
  socials: { pinterest:'', instagram:'', github:'', youtube:'', whatsapp:'', telegram:'', twitter:'', email:'', website:'' }
};

var SOCIAL_META = {
  pinterest:{icon:'fa-brands fa-pinterest',label:'Pinterest',glow:'rgba(230,0,35,.6)'},
  instagram:{icon:'fa-brands fa-instagram',label:'Instagram',glow:'rgba(225,48,108,.6)'},
  github:{icon:'fa-brands fa-github',label:'GitHub',glow:'rgba(167,139,250,.6)'},
  youtube:{icon:'fa-brands fa-youtube',label:'YouTube',glow:'rgba(255,0,0,.6)'},
  whatsapp:{icon:'fa-brands fa-whatsapp',label:'WhatsApp',glow:'rgba(37,211,102,.6)'},
  telegram:{icon:'fa-brands fa-telegram',label:'Telegram',glow:'rgba(34,158,217,.6)'},
  twitter:{icon:'fa-brands fa-x-twitter',label:'X (Twitter)',glow:'rgba(255,255,255,.5)'},
  email:{icon:'fa-solid fa-envelope',label:'Email',glow:'rgba(245,158,11,.6)'},
  website:{icon:'fa-solid fa-globe',label:'Website',glow:'rgba(34,211,238,.6)'}
};

var TAGLINES = DEFAULTS.taglines.slice();

/* ============ SMALL HELPERS ============ */
var toastTimer;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function ensureHttp(v){ return /^https?:\/\//i.test(v) ? v : 'https://' + v; }
function socialHref(k, v){
  if (k === 'email') return 'mailto:' + v;
  if (k === 'whatsapp') return /^\+?\d[\d\s-]+$/.test(v) ? 'https://wa.me/' + v.replace(/[^\d]/g,'') : ensureHttp(v);
  return ensureHttp(v);
}

/* ============ TYPING EFFECT ============ */
var typeTimer = null, ti = 0, tc = 0, tDel = false;
function startTyping(){
  (function tick(){
    var list = (TAGLINES && TAGLINES.length) ? TAGLINES : ['✨'];
    var word = String(list[ti % list.length] || '');
    if (!tDel){
      tc++;
      $('typeText').textContent = word.slice(0, tc);
      if (tc >= word.length){ tDel = true; typeTimer = setTimeout(tick, 1700); return; }
      typeTimer = setTimeout(tick, 70);
    } else {
      tc--;
      $('typeText').textContent = word.slice(0, tc);
      if (tc <= 0){ tDel = false; ti++; typeTimer = setTimeout(tick, 380); return; }
      typeTimer = setTimeout(tick, 34);
    }
  })();
}

/* ============ MUSIC ============ */
var audioEl = $('bgMusic'), musicOn = false;
function setupMusic(url){
  url = String(url || '').trim();
  if (url){
    audioEl.src = url;
    $('musicBtn').classList.remove('hidden');
  } else {
    audioEl.pause();
    audioEl.removeAttribute('src');
    musicOn = false;
    $('musicBtn').classList.add('hidden');
    $('musicBtn').classList.remove('playing');
    $('musicBtn').textContent = '🎵';
  }
}
$('musicBtn').addEventListener('click', function(){
  if (!audioEl.src) return;
  if (musicOn){ audioEl.pause(); }
  else { audioEl.play().catch(function(){ toast('Tap again — browser blocked autoplay 🙈'); }); }
  musicOn = !musicOn;
  $('musicBtn').classList.toggle('playing', musicOn);
  $('musicBtn').textContent = musicOn ? '🔊' : '🎵';
});

/* ============ RENDER PROFILE ============ */
function renderProfile(val){
  var p = Object.assign({}, DEFAULTS, val || {});
  p.socials = Object.assign({}, DEFAULTS.socials, (val && val.socials) || {});
  TAGLINES = (Array.isArray(p.taglines) && p.taglines.length) ? p.taglines.map(String) : DEFAULTS.taglines;

  document.title = p.name + ' ✨ | My World';
  $('nameEl').textContent = p.name;
  $('avatarLetter').textContent = (String(p.name || 'A').trim().charAt(0) || 'A').toUpperCase();

  if (p.avatar){ $('avatarImg').src = p.avatar; $('avatarBox').classList.add('has-img'); }
  else { $('avatarBox').classList.remove('has-img'); }

  if (p.banner){
    $('bannerImg').src = p.banner;
    $('bannerImg').classList.remove('hidden');
    $('bannerBlobs').classList.add('hidden');
  } else {
    $('bannerImg').classList.add('hidden');
    $('bannerBlobs').classList.remove('hidden');
  }

  $('moodPill').textContent = ((p.moodEmoji || '') + ' ' + (p.mood || '')).trim() || '😎 Vibing';
  $('locPill').textContent = '📍 ' + (p.location || 'Somewhere on Earth 🌍');
  $('bioEl').textContent = p.bio || '';

  var sk = String(p.skills || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  $('skillsEl').innerHTML = sk.map(function(s, i){
    return '<span class="chip" style="animation-delay:' + (i * 90) + 'ms">' + escapeHtml(s) + '</span>';
  }).join('');

  var order = ['pinterest','instagram','github','youtube','whatsapp','telegram','twitter','email','website'];
  var html = '';
  order.forEach(function(k){
    var v = String(p.socials[k] || '').trim();
    if (!v) return;
    var m = SOCIAL_META[k];
    html += '<a class="social-btn" href="' + escapeHtml(socialHref(k, v)) + '" target="_blank" rel="noopener" title="' + m.label + '" style="--glow:' + m.glow + '"><i class="' + m.icon + '"></i></a>';
  });
  $('socialsEl').innerHTML = html;

  var pin = String(p.socials.pinterest || '').trim();
  if (pin){ $('pinCta').href = ensureHttp(pin); $('pinCta').classList.add('show'); }
  else { $('pinCta').classList.remove('show'); }

  setupMusic(p.music);
  startTyping();
}

/* ============ EASTER EGG: CLICK AVATAR ============ */
$('avatarRing').addEventListener('click', function(){
  var r = $('avatarRing');
  r.classList.remove('spinme');
  void r.offsetWidth;
  r.classList.add('spinme');
});

/* ============ SHARE ============ */
$('shareBtn').addEventListener('click', function(){
  var url = location.href;
  if (navigator.share){
    navigator.share({ title: document.title, text: 'Check out my profile ✨', url: url }).catch(function(){});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){ toast('Link copied ✅'); }).catch(function(){ prompt('Copy this link:', url); });
  } else {
    prompt('Copy this link:', url);
  }
});

/* ============ 3D TILT + GLARE ============ */
var card = $('tiltCard'), glare = $('glare');
var rx = 0, ry = 0, tx = 0, ty = 0;
if (window.matchMedia && matchMedia('(pointer:fine)').matches){
  card.addEventListener('pointermove', function(e){
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    ty = (px - .5) * 13;
    tx = -(py - .5) * 11;
    glare.style.opacity = '.5';
    glare.style.background = 'radial-gradient(circle at ' + (px * 100) + '% ' + (py * 100) + '%, rgba(255,255,255,.25), transparent 55%)';
  });
  card.addEventListener('pointerleave', function(){ tx = 0; ty = 0; glare.style.opacity = '0'; });
}
(function loop(){
  rx += (tx - rx) * .09;
  ry += (ty - ry) * .09;
  card.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
  requestAnimationFrame(loop);
})();

/* ============ 3D GALAXY BACKGROUND (three.js) ============ */
function init3D(){
  if (typeof THREE === 'undefined') return;
  try {
    var canvas = $('bg3d');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 200);
    camera.position.z = 9;

    var mobile = innerWidth < 600;
    var N = mobile ? 900 : 1700;
    var pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    var palette = [new THREE.Color('#8b5cf6'), new THREE.Color('#06b6d4'), new THREE.Color('#f472b6'), new THREE.Color('#ffffff')];
    for (var i = 0; i < N; i++){
      var r = 5.5 + Math.random() * 6.5;
      var th = Math.random() * Math.PI * 2;
      var ph = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      pos[i*3+2] = r * Math.cos(ph);
      var c = palette[(Math.random() * palette.length) | 0];
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({ size: mobile ? .06 : .05, vertexColors: true, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false });
    var stars = new THREE.Points(geo, mat);
    scene.add(stars);

    var ring = new THREE.Mesh(new THREE.TorusGeometry(3.2, .012, 8, 120), new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: .35 }));
    ring.rotation.x = Math.PI / 2.6;
    scene.add(ring);
    var ring2 = new THREE.Mesh(new THREE.TorusGeometry(4.4, .01, 8, 120), new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: .25 }));
    ring2.rotation.x = Math.PI / 1.9;
    ring2.rotation.y = .4;
    scene.add(ring2);

    var mx = 0, my = 0;
    addEventListener('pointermove', function(e){
      mx = (e.clientX / innerWidth - .5);
      my = (e.clientY / innerHeight - .5);
    }, { passive: true });

    var clock = new THREE.Clock();
    (function animate(){
      requestAnimationFrame(animate);
      var t = clock.getElapsedTime();
      stars.rotation.y = t * .04 + mx * .5;
      stars.rotation.x = my * .35;
      ring.rotation.z = t * .15;
      ring2.rotation.z = -t * .1;
      camera.position.x += (mx * 1.2 - camera.position.x) * .03;
      camera.position.y += (-my * 1.2 - camera.position.y) * .03;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    })();

    addEventListener('resize', function(){
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  } catch (e) { /* if 3D fails, the page still works fine */ }
}
init3D();

/* ============ FIREBASE (live data) ============ */
function hideLoader(){ $('loader').classList.add('done'); }

if (window.IS_CONFIGURED){
  var db = firebase.database();
  db.ref('profile').on('value', function(snap){
    renderProfile(snap.val());
    hideLoader();
  }, function(err){
    console.warn('DB read failed:', err && err.message);
    renderProfile(null);
    hideLoader();
  });
  db.ref('stats/visits').transaction(function(v){ return (v || 0) + 1; }).catch(function(){});
  db.ref('stats/visits').on('value', function(s){
    var v = s.val();
    $('visitsEl').textContent = (typeof v === 'number' ? v : 0).toLocaleString('en-IN');
  });
} else {
  renderProfile(null); /* demo look until you connect Firebase */
}

window.addEventListener('load', function(){ setTimeout(hideLoader, 500); });
setTimeout(hideLoader, 2600);
})();
</script>
