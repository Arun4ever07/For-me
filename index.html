*{margin:0;padding:0;box-sizing:border-box}
:root{--violet:#7d5bb9;--cyan:#218e9b;--pink:#c76597;--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.14);--text:#eef0ff;--muted:#a7abc9}
html{scroll-behavior:smooth}body{font-family:Poppins,sans-serif;background:#07070f;color:var(--text);min-height:100vh;overflow-x:hidden}
#bg3d{position:fixed;inset:0;z-index:0}.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.43;z-index:1;pointer-events:none;animation:floaty 16s ease-in-out infinite}.b1{width:430px;height:430px;background:#56309f;top:-130px;left:-130px}.b2{width:380px;height:380px;background:#08798b;bottom:-120px;right:-110px;animation-delay:-5s}.b3{width:300px;height:300px;background:#a73b74;top:38%;left:58%;animation-delay:-10s;opacity:.25}@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,-45px) scale(1.15)}}
.star{position:fixed;z-index:1;font-size:20px;opacity:.36;pointer-events:none;animation:floaty 12s ease-in-out infinite}.s1{top:12%;left:6%}.s2{top:18%;right:8%;animation-delay:-3s}.s3{bottom:16%;left:10%;animation-delay:-6s}.s4{bottom:12%;right:6%;animation-delay:-9s}
#loader{position:fixed;inset:0;z-index:100;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:.6s}.done{opacity:0!important;visibility:hidden!important}.loader-logo{width:78px;height:78px;border-radius:20px;background:linear-gradient(135deg,#4d288d,#147f91);display:grid;place-items:center;font-weight:700;font-size:28px;box-shadow:0 0 35px rgba(111,71,193,.38);animation:loaderPulse 1.7s ease-in-out infinite}@keyframes loaderPulse{50%{transform:scale(1.07);box-shadow:0 0 0 22px rgba(111,71,193,0)}}.loader-text{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
.scene{position:relative;z-index:2;perspective:1400px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:42px 16px}.card{position:relative;width:100%;max-width:470px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.025));border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.62);overflow:hidden;will-change:transform}.glare{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:.3s}
.banner{position:relative;height:165px;background:linear-gradient(120deg,#1b1035,#0b2030 45%,#2a0f2e);overflow:hidden}.banner-img{width:100%;height:100%;object-fit:cover;animation:kenburns 18s ease-in-out infinite alternate}@keyframes kenburns{to{transform:scale(1.14) translate(12px,-8px)}}.banner-blobs span{position:absolute;border-radius:50%;filter:blur(30px);opacity:.8;animation:blobmove 9s ease-in-out infinite}.banner-blobs span:nth-child(1){width:150px;height:150px;background:var(--violet);top:-40px;left:10%}.banner-blobs span:nth-child(2){width:120px;height:120px;background:var(--cyan);bottom:-30px;right:15%;animation-delay:-3s}.banner-blobs span:nth-child(3){width:90px;height:90px;background:var(--pink);top:20px;right:35%;animation-delay:-6s}@keyframes blobmove{50%{transform:translate(30px,18px)}}.banner:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(7,7,15,.58))}
.avatar-zone{display:flex;justify-content:center;margin-top:-60px;position:relative;z-index:6}.avatar-ring{position:relative;width:118px;height:118px;cursor:pointer;border-radius:50%;transform-style:preserve-3d;animation:avatarFloat 5s ease-in-out infinite}@keyframes avatarFloat{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-7px) rotateY(7deg)}}.avatar{position:absolute;inset:0;overflow:hidden;border-radius:50%;background:#151522;border:2px solid rgba(247,241,229,.78);box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 0 0 4px rgba(0,0,0,.20);z-index:2}.avatar img{width:100%;height:100%;object-fit:cover;display:none}.avatar .letter{position:absolute;inset:0;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:55px;font-weight:700;background:linear-gradient(135deg,#50318c,#187e8e);color:#f7f1e5}.avatar.has-img img{display:block}.avatar.has-img .letter{display:none}.online-dot{position:absolute;right:5px;bottom:7px;width:14px;height:14px;background:#5eea9a;border:2px solid #0c0c16;border-radius:50%;z-index:3;box-shadow:0 0 12px rgba(94,234,154,.9)}.spinme{animation:flip .85s cubic-bezier(.6,.05,.3,1)!important}@keyframes flip{to{transform:rotateY(360deg)}}
.content{padding:18px 26px 28px;text-align:center;position:relative;z-index:6}.name{margin-top:2px;font-family:'Cormorant Garamond',Georgia,serif;font-size:43px;font-weight:700;line-height:1;letter-spacing:1px;color:#f7f1e5;text-shadow:0 2px 0 rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.45)}.typing{min-height:26px;margin-top:8px;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}.caret{width:2px;height:17px;background:var(--cyan);display:inline-block;animation:blink .8s step-end infinite;margin-left:3px}@keyframes blink{50%{opacity:0}}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 6px}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:var(--glass);border:1px solid var(--border);font-size:13px;color:var(--muted)}.mood{color:#fff!important;border:1px solid rgba(139,92,246,.25)!important;background:linear-gradient(135deg,rgba(87,51,149,.46),rgba(11,107,121,.42))!important;animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.bio-box{position:relative;margin:16px 0 4px;padding:15px 16px 15px 20px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--border);text-align:left}.bio-box:before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(#7b55bd,#30a7b6)}.bio-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7ed4dc;margin-bottom:7px;font-weight:600}.bio{font-size:13.5px;line-height:1.75;color:#d4d5e5;white-space:pre-line;word-break:break-word}
.skills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}.chip{padding:7px 13px;font-size:12px;border-radius:999px;background:var(--glass);border:1px solid var(--border);color:#e2e1e8;animation:chipin .5s backwards;transition:.25s}.chip:hover{transform:translateY(-3px);border-color:#8565b8;box-shadow:0 6px 16px rgba(92,62,145,.3)}@keyframes chipin{from{opacity:0;transform:translateY(14px) scale(.85)}}.socials{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0 6px}.social-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--border);color:#f7f1e5;font-size:19px;text-decoration:none;transition:.25s}.social-btn:hover{transform:translateY(-6px) scale(1.06);border-color:rgba(247,241,229,.45);box-shadow:0 12px 26px rgba(0,0,0,.45),0 0 20px var(--glow)}.pinterest-cta{display:none;margin:15px auto 0;align-items:center;justify-content:center;gap:10px;width:max-content;padding:11px 21px;border-radius:999px;background:linear-gradient(135deg,#bd0926,#e43250);color:#fff;text-decoration:none;font-size:13px;font-weight:600;box-shadow:0 10px 28px rgba(180,0,30,.32);transition:.25s}.pinterest-cta.show{display:flex;animation:chipin .5s}.pinterest-cta:hover{transform:translateY(-3px) scale(1.03)}.music-btn{position:fixed;right:18px;bottom:18px;z-index:50;width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:rgba(20,20,40,.75);backdrop-filter:blur(10px);color:#fff;font-size:21px;cursor:pointer;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}.music-btn:hover{transform:scale(1.1)}.music-btn.playing{animation:beat 1s ease-in-out infinite;border-color:var(--cyan)}@keyframes beat{50%{transform:scale(1.12)}}.hidden{display:none!important}@media(max-width:430px){.name{font-size:37px}.content{padding:17px 18px 26px}.banner{height:140px}.avatar-ring{width:105px;height:105px}.avatar .letter{font-size:45px}}@media(max-width:560px){.star{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);const defaults={name:'Arun4ever',taglines:['Creative Web Developer','Building websites with style','A personal corner of the web'],bio:'Welcome to my corner of the internet. I enjoy creating thoughtful websites, animations and digital experiences.',mood:'Creative',moodEmoji:'😎',location:'Ahmedabad, India 🇮🇳',avatar:'',banner:'',music:'',skills:'HTML, CSS, JavaScript, Firebase, Web Design',socials:{pinterest:'',instagram:'',github:'',youtube:'',whatsapp:'',telegram:'',twitter:'',email:'',website:''}};const meta={pinterest:['fa-brands fa-pinterest','Pinterest','rgba(230,0,35,.6)'],instagram:['fa-brands fa-instagram','Instagram','rgba(225,48,108,.6)'],github:['fa-brands fa-github','GitHub','rgba(167,139,250,.6)'],youtube:['fa-brands fa-youtube','YouTube','rgba(255,0,0,.6)'],whatsapp:['fa-brands fa-whatsapp','WhatsApp','rgba(37,211,102,.6)'],telegram:['fa-brands fa-telegram','Telegram','rgba(34,158,217,.6)'],twitter:['fa-brands fa-x-twitter','X','rgba(255,255,255,.5)'],email:['fa-solid fa-envelope','Email','rgba(245,158,11,.6)'],website:['fa-solid fa-globe','Website','rgba(34,211,238,.6)']};let taglines=defaults.taglines,tagIndex=0,charIndex=0,deleting=false,typing=false;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const web=v=>/^https?:\/\//i.test(v)?v:'https://'+v;function link(k,v){if(k==='email')return'mailto:'+v;if(k==='whatsapp'&&/^\+?\d[\d\s-]+$/.test(v))return'https://wa.me/'+v.replace(/\D/g,'');return web(v)}function type(){const word=String(taglines[tagIndex%taglines.length]||'');if(!deleting){charIndex++;$('typeText').textContent=word.slice(0,charIndex);if(charIndex>=word.length){deleting=true;setTimeout(type,1650);return}setTimeout(type,65)}else{charIndex--;$('typeText').textContent=word.slice(0,charIndex);if(charIndex<=0){deleting=false;tagIndex++;setTimeout(type,350);return}setTimeout(type,30)}}function startTyping(){if(!typing){typing=true;type()}}function render(value){const p=Object.assign({},defaults,value||{});p.socials=Object.assign({},defaults.socials,(value&&value.socials)||{});taglines=Array.isArray(p.taglines)&&p.taglines.length?p.taglines:defaults.taglines;document.title=p.name+' | Profile';$('nameEl').textContent=p.name;$('avatarLetter').textContent=(p.name.trim()[0]||'A').toUpperCase();if(p.avatar){$('avatarImg').src=p.avatar;$('avatarBox').classList.add('has-img')}else $('avatarBox').classList.remove('has-img');if(p.banner){$('bannerImg').src=p.banner;$('bannerImg').classList.remove('hidden');$('bannerBlobs').classList.add('hidden')}else{$('bannerImg').classList.add('hidden');$('bannerBlobs').classList.remove('hidden')}$('moodPill').textContent=((p.moodEmoji||'')+' '+(p.mood||'')).trim()||'😎 Creative';$('locPill').textContent='📍 '+(p.location||'Somewhere on Earth');$('bioEl').textContent=p.bio||'';const skills=String(p.skills||'').split(',').map(x=>x.trim()).filter(Boolean);$('skillsEl').innerHTML=skills.map((x,i)=>'<span class="chip" style="animation-delay:'+i*80+'ms">'+esc(x)+'</span>').join('');let html='';['pinterest','instagram','github','youtube','whatsapp','telegram','twitter','email','website'].forEach(k=>{const v=String(p.socials[k]||'').trim();if(!v)return;const m=meta[k];html+='<a class="social-btn" href="'+esc(link(k,v))+'" target="_blank" rel="noopener" title="'+m[1]+'" style="--glow:'+m[2]+'"><i class="'+m[0]+'"></i></a>'});$('socialsEl').innerHTML=html;const pin=String(p.socials.pinterest||'').trim();if(pin){$('pinCta').href=web(pin);$('pinCta').classList.add('show')}else $('pinCta').classList.remove('show');const audio=$('bgMusic'),button=$('musicBtn');if(p.music){audio.src=p.music;button.classList.remove('hidden')}else{audio.pause();audio.removeAttribute('src');button.classList.add('hidden')}startTyping()}
$('avatarRing').onclick=function(){this.classList.remove('spinme');void this.offsetWidth;this.classList.add('spinme')};let playing=false;$('musicBtn').onclick=function(){const audio=$('bgMusic');if(playing)audio.pause();else audio.play().catch(()=>{});playing=!playing;this.classList.toggle('playing',playing);this.textContent=playing?'♫':'♪'};const card=$('tiltCard'),glare=$('glare');let rx=0,ry=0,tx=0,ty=0;if(matchMedia('(pointer:fine)').matches){card.onpointermove=e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;ty=(x-.5)*11;tx=-(y-.5)*9;glare.style.opacity='.45';glare.style.background='radial-gradient(circle at '+x*100+'% '+y*100+'%,rgba(255,255,255,.22),transparent 55%)'};card.onpointerleave=()=>{tx=ty=0;glare.style.opacity=0}}(function tilt(){rx+=(tx-rx)*.09;ry+=(ty-ry)*.09;card.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';requestAnimationFrame(tilt)})();
function init3d(){if(!window.THREE)return;try{const renderer=new THREE.WebGLRenderer({canvas:$('bg3d'),alpha:true,antialias:true}),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);camera.position.z=9;const n=innerWidth<600?800:1500,pos=new Float32Array(n*3),color=new Float32Array(n*3),colors=[new THREE.Color('#7d5bb9'),new THREE.Color('#218e9b'),new THREE.Color('#c76597'),new THREE.Color('#ffffff')];for(let i=0;i<n;i++){const r=5.5+Math.random()*6.5,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),c=colors[Math.floor(Math.random()*colors.length)];pos[i*3]=r*Math.sin(p)*Math.cos(t);pos[i*3+1]=r*Math.sin(p)*Math.sin(t);pos[i*3+2]=r*Math.cos(p);color[i*3]=c.r;color[i*3+1]=c.g;color[i*3+2]=c.b}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(pos,3));geometry.setAttribute('color',new THREE.BufferAttribute(color,3));const stars=new THREE.Points(geometry,new THREE.PointsMaterial({size:.052,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(stars);const ring=new THREE.Mesh(new THREE.TorusGeometry(3.2,.012,8,120),new THREE.MeshBasicMaterial({color:0x7d5bb9,transparent:true,opacity:.3}));ring.rotation.x=1.2;scene.add(ring);let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});const clock=new THREE.Clock();(function animate(){requestAnimationFrame(animate);const time=clock.getElapsedTime();stars.rotation.y=time*.04+mx*.5;stars.rotation.x=my*.3;ring.rotation.z=time*.13;camera.position.x+=(mx-camera.position.x)*.03;camera.position.y+=(-my-camera.position.y)*.03;camera.lookAt(0,0,0);renderer.render(scene,camera)})();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(error){console.warn('3D background unavailable',error)}}init3d();const finish=()=>$('loader').classList.add('done');if(window.IS_CONFIGURED&&window.firebase){firebase.database().ref('profile').on('value',snap=>{render(snap.val());finish()},()=>{render(null);finish()})}else render(null);addEventListener('load',()=>setTimeout(finish,450));setTimeout(finish,2500)})();
</script>
