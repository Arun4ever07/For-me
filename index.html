  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --paper:#f7f5f0;
      --ink:#171513;
      --line:#dedad1;
      --muted:#77736c;
      --accent:#b18a4e;
      --card:#fffdf9;
      --shadow:rgba(46,35,21,.12);
      --body-font:Poppins,sans-serif;
      --title-font:"Cormorant Garamond",serif;
    }

    body{
      background:var(--paper);
      color:var(--ink);
      font-family:var(--body-font);
    }

    body.theme-default{
      --paper:#101116;
      --ink:#f3f1e9;
      --line:#30313a;
      --muted:#aaa9b1;
      --accent:#8297ff;
      --card:#191a20;
      --shadow:rgba(0,0,0,.28);
    }

    .hide{
      display:none!important;
    }

    /* ========================================================
       SEAMLESS INTRO: "THE ACT OF CREATING SOMETHING"
       ======================================================== */
    .loader{
      position:fixed;
      z-index:999;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--paper);
      transition:opacity .7s cubic-bezier(0.4, 0, 0.2, 1), visibility .7s;
      overflow:hidden;
      padding:24px 16px;
    }

    .loader.done{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    /* Seamless Non-Isolated Canvas Wrapper */
    .art-stage{
      position:relative;
      max-width:680px;
      width:100%;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      user-select:none;
    }

    /* Organic Floating Doodles */
    .doodle{
      position:absolute;
      pointer-events:none;
      opacity:0;
      animation:doodleFade .8s ease forwards;
    }

    .doodle-loop{
      top:-16px;
      right:8%;
      width:clamp(75px, 15vw, 115px);
      height:clamp(70px, 14vw, 105px);
      animation-delay:.45s;
    }

    .doodle-flower{
      bottom:22%;
      left:2%;
      width:clamp(44px, 9vw, 62px);
      height:clamp(44px, 9vw, 62px);
      animation-delay:.6s;
    }

    .doodle-star{
      bottom:10%;
      right:4%;
      width:clamp(75px, 15vw, 110px);
      height:clamp(75px, 15vw, 110px);
      animation-delay:.75s;
    }

    .sparkle{
      position:absolute;
      color:#b77be0;
      font-size:clamp(18px, 4vw, 26px);
      line-height:1;
      opacity:0;
      animation:sparklePop .6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .sparkle-1{ top:18%; left:5%; animation-delay:.35s; }
    .sparkle-2{ top:34%; right:4%; animation-delay:.65s; }

    @keyframes doodleFade{
      to{ opacity:0.9; }
    }

    @keyframes sparklePop{
      0%{ opacity:0; transform:scale(0) rotate(-45deg); }
      100%{ opacity:0.95; transform:scale(1) rotate(0deg); }
    }

    /* Kinetic Lettering Container */
    .quote-content{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      width:100%;
    }

    .art-row{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:nowrap;
      line-height:1.02;
    }

    .row-act{
      font-family:"Permanent Marker", cursive, sans-serif;
      color:#e52229;
      font-size:clamp(28px, 7.5vw, 64px);
      letter-spacing:clamp(1px, 0.3vw, 3px);
      margin-bottom:clamp(2px, 0.8vw, 6px);
    }

    .row-creating{
      font-family:"Rubik Marker Hatch", "Permanent Marker", cursive, sans-serif;
      color:#e52229;
      font-size:clamp(42px, 11.8vw, 98px);
      letter-spacing:clamp(1.5px, 0.6vw, 5px);
      font-weight:900;
      line-height:0.95;
      text-shadow:0.5px 0.5px 0 #cc171e, -0.5px -0.5px 0 #ff4a50;
    }

    .row-something{
      font-family:"Rubik Marker Hatch", "Permanent Marker", cursive, sans-serif;
      color:#e52229;
      font-size:clamp(32px, 8.8vw, 74px);
      letter-spacing:clamp(1px, 0.5vw, 4px);
      font-weight:900;
      line-height:1;
      margin-top:clamp(2px, 0.8vw, 6px);
      text-shadow:0.5px 0.5px 0 #cc171e;
    }

    .letter-span{
      display:inline-block;
      opacity:0;
      transform:translateY(28px) scale(.75) rotate(calc(var(--r, 0deg) * 2));
      animation:
        letterSpring .52s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards,
        letterFloat 3.4s ease-in-out infinite alternate;
      animation-delay:var(--d, 0s), calc(var(--d, 0s) + .52s);
    }

    .letter-space{
      display:inline-block;
      width:clamp(8px, 2.2vw, 20px);
    }

    @keyframes letterSpring{
      0%{
        opacity:0;
        transform:translateY(28px) scale(.7) rotate(calc(var(--r, 0deg) * 2));
      }
      70%{
        transform:translateY(-4px) scale(1.06) rotate(var(--r, 0deg));
      }
      100%{
        opacity:1;
        transform:translateY(0) scale(1) rotate(var(--r, 0deg));
      }
    }

    @keyframes letterFloat{
      0%{
        transform:translateY(0) rotate(var(--r, 0deg));
      }
      100%{
        transform:translateY(-4px) rotate(calc(var(--r, 0deg) + 0.8deg));
      }
    }

    /* Subtext: "IS ALWAYS MORE IMPORTANT THAN THE RESULT" */
    .art-subtext{
      margin-top:clamp(16px, 3.8vw, 30px);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      font-family:"Space Mono", "Space Grotesk", monospace;
      color:#8f6cd4;
      font-size:clamp(10px, 2.5vw, 17px);
      font-weight:700;
      letter-spacing:clamp(1.5px, 0.4vw, 3.5px);
      text-transform:uppercase;
      opacity:0;
      animation:subtextIn .7s ease forwards;
      animation-delay:1.1s;
    }

    .subtext-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(6px, 1.6vw, 14px);
      white-space:nowrap;
    }

    .subtext-underline{
      position:relative;
      display:inline-block;
    }

    .subtext-underline::after{
      content:"";
      position:absolute;
      left:-4px;
      right:-4px;
      bottom:-3px;
      height:2.5px;
      background:#be84e6;
      border-radius:2px;
      transform:rotate(-0.8deg);
    }

    @keyframes subtextIn{
      0%{
        opacity:0;
        transform:translateY(14px);
      }
      100%{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* ========================================================
       PAGE CONTENT STYLES
       ======================================================== */
    .page{
      width:min(1200px,100%);
      margin:36px auto;
      padding:0 20px;
      display:grid;
      grid-template-columns:420px minmax(0,1fr);
      gap:42px;
      align-items:start;
    }

    .panel{
      overflow:visible;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--card);
      box-shadow:0 14px 35px var(--shadow);
    }

    .banner{
      position:relative;
      height:230px;
      overflow:hidden;
      border-radius:11px 11px 0 0;
      background:linear-gradient(120deg,#23162b,#684633 48%,#153c40);
    }

    .banner::after{
      position:absolute;
      inset:0;
      content:"";
      background:linear-gradient(
        180deg,
        transparent 40%,
        rgba(0,0,0,.28)
      );
      pointer-events:none;
    }

    .banner-img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }

    .fallback{
      width:100%;
      height:100%;
      background:linear-gradient(120deg,#23162b,#684633 48%,#153c40);
    }

    .head{
      position:relative;
      display:flex;
      align-items:flex-end;
      gap:16px;
      min-height:178px;
      padding:0 20px 20px;
    }

    .avatar{
      position:relative;
      z-index:5;
      width:160px;
      height:160px;
      flex:none;
      margin-top:-80px;
      overflow:hidden;
      border:3px solid var(--card);
      border-radius:50%;
      background:#37244d;
      box-shadow:0 16px 34px rgba(0,0,0,.33);
      transition:transform .3s ease,box-shadow .3s ease;
    }

    .avatar:hover{
      transform:translateY(-5px) rotate(-1deg);
      box-shadow:0 23px 42px rgba(0,0,0,.36);
    }

    .avatar img{
      display:none;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }

    .avatar.has-img img{
      display:block;
    }

    .avatar.has-img .letter{
      display:none;
    }

    .letter{
      display:grid;
      width:100%;
      height:100%;
      place-items:center;
      color:#fff7ec;
      font:700 74px var(--title-font);
    }

    .identity{
      min-width:0;
      padding-bottom:3px;
    }

    .name{
      font:700 40px/.9 var(--title-font);
      overflow-wrap:anywhere;
    }

    .tagline{
      margin-top:8px;
      color:var(--muted);
      font-size:10px;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      margin-top:9px;
    }

    .pill{
      padding:5px 8px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      font-size:8px;
      white-space:nowrap;
    }

    .content{
      min-height:420px;
      padding:24px 20px;
      border-top:1px solid var(--line);
    }

    .label{
      margin-bottom:9px;
      color:var(--accent);
      font-size:8px;
      font-weight:700;
      letter-spacing:1.8px;
      text-transform:uppercase;
    }

    .bio{
      color:var(--ink);
      font-family:"Libre Baskerville",serif;
      font-size:18px;
      font-weight:400;
      line-height:1.72;
      white-space:pre-line;
    }

    .bar{
      width:36px;
      height:2px;
      margin:17px 0;
      background:var(--accent);
    }

    .detail{
      color:var(--muted);
      font-size:11px;
      line-height:1.75;
      white-space:pre-line;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:18px;
    }

    .skill{
      padding:5px 8px;
      border:1px solid var(--line);
      border-radius:4px;
      color:var(--muted);
      font-size:9px;
    }

    .right-title{
      font:700 40px/1 var(--title-font);
    }

    .right-sub{
      max-width:560px;
      margin:9px 0 23px;
      color:var(--muted);
      font-size:12px;
      line-height:1.75;
      white-space:pre-line;
    }

    .works{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .work{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--card);
      transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;
    }

    .work:hover{
      transform:translateY(-6px);
      border-color:var(--accent);
      box-shadow:0 16px 30px var(--shadow);
    }

    .work:active{
      transform:translateY(-1px) scale(.985);
    }

    .work-gallery{
      position:relative;
      width:100%;
      overflow:hidden;
      background:#101116;
      line-height:0;
    }

    .work-slide{
      display:none;
      width:100%;
      height:auto;
      max-width:100%;
      object-fit:contain;
      background:#101116;
    }

    .work-slide.active{
      display:block;
      animation:fadeImage .7s ease;
    }

    @keyframes fadeImage{
      from{
        opacity:0;
        transform:scale(1.018);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .gallery-count{
      position:absolute;
      z-index:3;
      top:9px;
      right:9px;
      padding:5px 7px;
      border-radius:999px;
      background:rgba(0,0,0,.60);
      color:#fff;
      font-size:8px;
      line-height:1;
    }

    .gallery-dots{
      position:absolute;
      z-index:3;
      right:10px;
      bottom:9px;
      left:10px;
      display:flex;
      justify-content:center;
      gap:5px;
    }

    .gallery-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(255,255,255,.45);
      transition:.25s ease;
    }

    .gallery-dot.active{
      transform:scale(1.5);
      background:#fff;
    }

    .gallery-next{
      position:absolute;
      z-index:4;
      top:50%;
      right:9px;
      display:grid;
      width:30px;
      height:30px;
      place-items:center;
      border:0;
      border-radius:50%;
      background:rgba(0,0,0,.56);
      color:#fff;
      cursor:pointer;
      opacity:0;
      transform:translateY(-50%);
      transition:.25s ease;
    }

    .work:hover .gallery-next{
      opacity:1;
    }

    .gallery-next:hover{
      transform:translateY(-50%) scale(1.1);
    }

    .work-body{
      padding:14px;
    }

    .work-title{
      font:700 23px/1 var(--title-font);
    }

    .work-caption{
      min-height:34px;
      margin:7px 0 12px;
      color:var(--muted);
      font-size:10px;
      line-height:1.65;
      white-space:pre-line;
    }

    .work-link{
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--accent);
      font-size:10px;
      font-weight:600;
      text-decoration:none;
    }

    .work-link i{
      transition:transform .25s ease;
    }

    .work:hover .work-link i{
      transform:translate(2px,-2px);
    }

    .empty{
      padding:38px 15px;
      border:1px dashed var(--line);
      border-radius:9px;
      color:var(--muted);
      font-size:11px;
      text-align:center;
    }

    .social-title{
      margin-top:30px;
    }

    .custom-title{
      margin-top:22px;
    }

    .socials{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .social{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:6px;
      color:var(--muted);
      font-size:10px;
      text-decoration:none;
      transition:.2s ease;
    }

    .social:hover{
      transform:translateY(-2px);
      border-color:var(--accent);
      color:var(--accent);
    }

    .music{
      position:fixed;
      z-index:20;
      right:18px;
      bottom:18px;
      width:46px;
      height:46px;
      border:0;
      border-radius:50%;
      background:#19171b;
      color:#fff;
      cursor:pointer;
      font-size:17px;
      box-shadow:0 8px 22px rgba(0,0,0,.25);
    }

    .music.playing{
      animation:spin 3s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @media(max-width:760px){
      .page{
        grid-template-columns:minmax(0,440px);
        justify-content:center;
        gap:28px;
        padding:0 12px;
      }

      .works{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:430px){
      .page{
        padding:0 9px;
      }

      .banner{
        height:190px;
      }

      .head{
        min-height:156px;
        gap:12px;
        padding:0 13px 16px;
      }

      .avatar{
        width:132px;
        height:132px;
        margin-top:-66px;
        border-width:3px;
      }

      .name{
        font-size:31px;
      }

      .bio{
        font-size:17px;
      }

      .letter{
        font-size:60px;
      }
    }
  </style>
</head>

  <main class="page">

    <section class="panel">

      <div class="banner">
        <img id="bannerImg" class="banner-img hide" alt="Profile banner">
        <div id="fallback" class="fallback"></div>
      </div>

      <div class="head">

        <div id="avatar" class="avatar">
          <img
            id="avatarImg"
            alt="Profile picture"
            referrerpolicy="no-referrer"
          >

          <div id="letter" class="letter">A</div>
        </div>

        <div class="identity">
          <h1 id="name" class="name">Loading…</h1>

          <p id="tagline" class="tagline"></p>

          <div class="meta">
            <span id="mood" class="pill"></span>
            <span id="location" class="pill"></span>
          </div>
        </div>

      </div>

      <div class="content">
        <div class="label">About me</div>

        <p id="bio" class="bio"></p>

        <div class="bar"></div>

        <p id="profileText" class="detail"></p>

        <div id="skills" class="skills"></div>
      </div>

    </section>

    <section>

      <h2 id="workTitle" class="right-title">My work</h2>

      <p id="workText" class="right-sub"></p>

      <div id="works" class="works"></div>

      <div id="socialWrap" class="hide">
        <div class="label social-title">Find me online</div>
        <div id="socials" class="socials"></div>
      </div>

      <div id="customWrap" class="hide">
        <div class="label custom-title">More links</div>
        <div id="customLinks" class="socials"></div>
      </div>

    </section>

  </main>

  <button id="music" class="music hide" type="button">♪</button>

  <audio id="audio" loop preload="none"></audio>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="firebase-config.js"></script>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      const defaults = {
        name: "Arun4ever",
        tagline: "Creative Web Developer",
        bio: "Welcome to my corner of the internet.",
        profileText: "",
        workTitle: "Selected work",
        workText: "",
        theme: "classic",
        profileFont: "Poppins",
        titleFont: "Cormorant Garamond",
        mood: "Creative",
        moodEmoji: "😎",
        location: "",
        avatar: "",
        banner: "",
        music: "",
        skills: "",
        works: [],
        socials: {},
        customLinks: []
      };

      const fonts = {
        "Poppins": "Poppins,sans-serif",
        "Inter": "Inter,sans-serif",
        "DM Sans": "\"DM Sans\",sans-serif",
        "Space Grotesk": "\"Space Grotesk\",sans-serif",
        "Playfair Display": "\"Playfair Display\",serif",
        "Cormorant Garamond": "\"Cormorant Garamond\",serif"
      };

      const icons = {
        pinterest: ["fa-brands fa-pinterest", "Pinterest"],
        instagram: ["fa-brands fa-instagram", "Instagram"],
        facebook: ["fa-brands fa-facebook-f", "Facebook"],
        linkedin: ["fa-brands fa-linkedin-in", "LinkedIn"],
        snapchat: ["fa-brands fa-snapchat", "Snapchat"],
        tiktok: ["fa-brands fa-tiktok", "TikTok"],
        github: ["fa-brands fa-github", "GitHub"],
        youtube: ["fa-brands fa-youtube", "YouTube"],
        discord: ["fa-brands fa-discord", "Discord"],
        telegram: ["fa-brands fa-telegram", "Telegram"],
        twitter: ["fa-brands fa-x-twitter", "X"],
        threads: ["fa-brands fa-threads", "Threads"],
        whatsapp: ["fa-brands fa-whatsapp", "WhatsApp"],
        spotify: ["fa-brands fa-spotify", "Spotify"],
        reddit: ["fa-brands fa-reddit-alien", "Reddit"],
        email: ["fa-solid fa-envelope", "Email"],
        website: ["fa-solid fa-globe", "Website"],
        other: ["fa-solid fa-link", "Link"]
      };

      let hasLoaded = false;
      let playing = false;

      // Allows animation sequence to play through gracefully before fading to main content
      const loadStartTime = Date.now();
      const minDisplayDuration = 2600;

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"]/g, character => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;"
          }[character];
        });
      }

      function safeURL(value) {
        const url = String(value || "").trim();
        if (!url) return "";
        return /^https?:\/\//i.test(url) ? url : "https://" + url;
      }

      function socialURL(platform, value) {
        const link = String(value || "").trim();
        if (platform === "email") {
          return "mailto:" + link;
        }
        if (platform === "whatsapp" && /^\+?\d[\d -]+$/.test(link)) {
          return "https://wa.me/" + link.replace(/\D/g, "");
        }
        return safeURL(link);
      }

      function hideLoader() {
        const elapsed = Date.now() - loadStartTime;
        const remaining = Math.max(0, minDisplayDuration - elapsed);

        setTimeout(() => {
          $("loader").classList.add("done");
        }, remaining);
      }

      function setAvatar(url) {
        const avatar = $("avatar");
        const image = $("avatarImg");

        if (!url) {
          avatar.classList.remove("has-img");
          image.removeAttribute("src");
          return;
        }

        avatar.classList.add("has-img");

        image.onerror = () => {
          avatar.classList.remove("has-img");
          image.removeAttribute("src");
        };

        image.src = safeURL(url);
      }

      function setBanner(url) {
        const image = $("bannerImg");
        const fallback = $("fallback");

        if (!url) {
          image.classList.add("hide");
          fallback.classList.remove("hide");
          image.removeAttribute("src");
          return;
        }

        image.onload = () => {
          image.classList.remove("hide");
          fallback.classList.add("hide");
        };

        image.onerror = () => {
          image.classList.add("hide");
          fallback.classList.remove("hide");
          image.removeAttribute("src");
        };

        image.src = safeURL(url);
      }

      function getWorkImages(work) {
        const images = [];

        if (Array.isArray(work.images)) {
          work.images.forEach(image => {
            if (typeof image === "string" && image.trim()) {
              images.push(image.trim());
            }
          });
        }

        if (
          typeof work.image === "string" &&
          work.image.trim() &&
          !images.includes(work.image.trim())
        ) {
          images.unshift(work.image.trim());
        }

        return images;
      }

      function createWorkCard(work) {
        const images = getWorkImages(work);

        const slides = images.map((image, index) => {
          return `
            <img
              class="work-slide ${index === 0 ? "active" : ""}"
              src="${escapeHTML(safeURL(image))}"
              alt="${escapeHTML(work.title)} image ${index + 1}"
              loading="lazy"
              referrerpolicy="no-referrer"
            >
          `;
        }).join("");

        const dots = images.length > 1
          ? `
            <div class="gallery-dots">
              ${images.map((_, index) => `
                <span class="gallery-dot ${index === 0 ? "active" : ""}"></span>
              `).join("")}
            </div>
          `
          : "";

        const count = images.length > 1
          ? `
            <span class="gallery-count">
              <span class="galleryCurrent">1</span>/${images.length}
            </span>
          `
          : "";

        const nextButton = images.length > 1
          ? `
            <button class="gallery-next" type="button">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          `
          : "";

        const gallery = images.length
          ? `
            <div class="work-gallery">
              ${slides}
              ${count}
              ${dots}
              ${nextButton}
            </div>
          `
          : "";

        const link = work.link
          ? `
            <a
              class="work-link"
              href="${escapeHTML(safeURL(work.link))}"
              target="_blank"
              rel="noopener"
            >
              View project
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
          `
          : "";

        return `
          <article class="work">
            ${gallery}

            <div class="work-body">
              <h3 class="work-title">${escapeHTML(work.title)}</h3>

              <p class="work-caption">
                ${escapeHTML(work.caption || "")}
              </p>

              ${link}
            </div>
          </article>
        `;
      }

      function startGalleries() {
        document.querySelectorAll(".work-gallery").forEach(gallery => {
          const slides = [...gallery.querySelectorAll(".work-slide")];
          const dots = [...gallery.querySelectorAll(".gallery-dot")];
          const number = gallery.querySelector(".galleryCurrent");
          const nextButton = gallery.querySelector(".gallery-next");

          if (slides.length < 2) return;

          let current = 0;
          let timer;

          function showSlide(index) {
            current = index;

            slides.forEach((slide, slideIndex) => {
              slide.classList.toggle(
                "active",
                slideIndex === current
              );
            });

            dots.forEach((dot, dotIndex) => {
              dot.classList.toggle(
                "active",
                dotIndex === current
              );
            });

            if (number) {
              number.textContent = current + 1;
            }
          }

          function nextSlide() {
            showSlide((current + 1) % slides.length);
          }

          function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
              nextSlide();
            }, 3500);
          }

          function stopTimer() {
            clearInterval(timer);
          }

          nextButton.addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            nextSlide();
            startTimer();
          });

          gallery.addEventListener("mouseenter", stopTimer);
          gallery.addEventListener("mouseleave", startTimer);

          gallery.addEventListener("touchstart", stopTimer, {
            passive: true
          });

          gallery.addEventListener("touchend", startTimer, {
            passive: true
          });

          showSlide(0);
          startTimer();
        });
      }

      function render(data) {
        hasLoaded = true;

        const profile = Object.assign({}, defaults, data || {});
        const socials = Object.assign(
          {},
          defaults.socials,
          (data && data.socials) || {}
        );

        document.body.className =
          "theme-" + (
            profile.theme === "default"
              ? "default"
              : "classic"
          );

        document.documentElement.style.setProperty(
          "--body-font",
          fonts[profile.profileFont] || fonts.Poppins
        );

        document.documentElement.style.setProperty(
          "--title-font",
          fonts[profile.titleFont] || fonts["Cormorant Garamond"]
        );

        $("name").textContent = profile.name || defaults.name;

        $("tagline").textContent =
          (Array.isArray(profile.taglines) && profile.taglines[0]) ||
          profile.tagline ||
          defaults.tagline;

        $("letter").textContent =
          (profile.name || defaults.name)
            .trim()
            .charAt(0)
            .toUpperCase() || "A";

        $("mood").textContent =
          ((profile.moodEmoji || "") + " " + (profile.mood || "")).trim();

        $("location").textContent =
          profile.location ? "📍 " + profile.location : "";

        $("bio").textContent = profile.bio || "";
        $("profileText").textContent = profile.profileText || "";
        $("workTitle").textContent =
          profile.workTitle || defaults.workTitle;

        $("workText").textContent =
          profile.workText || defaults.workText;

        setAvatar(profile.avatar);
        setBanner(profile.banner);

        $("skills").innerHTML = String(profile.skills || "")
          .split(",")
          .map(skill => skill.trim())
          .filter(Boolean)
          .map(skill => `<span class="skill">${escapeHTML(skill)}</span>`)
          .join("");

        const works = Array.isArray(profile.works)
          ? profile.works
          : [];

        $("works").innerHTML =
          works
            .filter(work => work && work.title)
            .map(createWorkCard)
            .join("") ||
          `
            <div class="empty">
              Work cards will appear here after they are added from the admin panel.
            </div>
          `;

        startGalleries();

        let socialHTML = "";

        Object.entries(icons).forEach(([platform, details]) => {
          const value = String(socials[platform] || "").trim();

          if (!value) return;

          socialHTML += `
            <a
              class="social"
              href="${escapeHTML(socialURL(platform, value))}"
              target="_blank"
              rel="noopener"
            >
              <i class="${details[0]}"></i>
              ${details[1]}
            </a>
          `;
        });

        $("socials").innerHTML = socialHTML;
        $("socialWrap").classList.toggle("hide", !socialHTML);

        const customLinks = Array.isArray(profile.customLinks)
          ? profile.customLinks
          : [];

        const customHTML = customLinks
          .filter(item => item && item.label && item.url)
          .map(item => `
            <a
              class="social"
              href="${escapeHTML(safeURL(item.url))}"
              target="_blank"
              rel="noopener"
            >
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              ${escapeHTML(item.label)}
            </a>
          `)
          .join("");

        $("customLinks").innerHTML = customHTML;
        $("customWrap").classList.toggle("hide", !customHTML);

        const audio = $("audio");
        const musicButton = $("music");

        if (profile.music) {
          audio.src = safeURL(profile.music);
          musicButton.classList.remove("hide");
        } else {
          audio.pause();
          audio.removeAttribute("src");
          musicButton.classList.add("hide");
          musicButton.classList.remove("playing");
        }

        hideLoader();
      }

      $("music").addEventListener("click", () => {
        const audio = $("audio");
        const button = $("music");

        if (playing) {
          audio.pause();
          playing = false;
          button.classList.remove("playing");
          return;
        }

        audio.play()
          .then(() => {
            playing = true;
            button.classList.add("playing");
          })
          .catch(() => {});
      });

      setTimeout(() => {
        if (!hasLoaded) {
          hideLoader();
        }
      }, 8000);

      try {
        if (
          !window.firebase ||
          !firebase.apps ||
          !firebase.apps.length
        ) {
          throw new Error("Firebase is not initialized.");
        }

        firebase.database().ref("profile").on(
          "value",
          snapshot => {
            render(snapshot.val());
          },
          error => {
            console.error(error);
            render(null);
          }
        );

      } catch (error) {
        console.error(error);
        render(null);
      }
    })();
  </script>

</body>
</html>
