<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#090911"><title>Arun4ever | Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--v:#7554ad;--c:#278a97;--p:#b65d8c;--border:rgba(255,255,255,.14);--glass:rgba(255,255,255,.065);--muted:#a9abc6}body{min-height:100vh;overflow-x:hidden;background:#090911;color:#eff0fa;font-family:Poppins,sans-serif}
/* Calm background: no moving 3D rings, no fast particles. Only two very slow light glows. */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#101629 0%,#090911 57%,#07070d 100%)}.glow{position:absolute;border-radius:50%;filter:blur(105px);opacity:.25;pointer-events:none}.glow.one{height:390px;width:390px;top:-180px;left:-170px;background:#6840a6;animation:calmGlow 28s ease-in-out infinite}.glow.two{height:330px;width:330px;right:-155px;bottom:-150px;background:#087582;animation:calmGlow 32s ease-in-out infinite reverse}@keyframes calmGlow{50%{transform:translate(28px,-20px) scale(1.08)}}.dust{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(226,230,255,.28) 1px,transparent 1.3px);background-size:82px 82px;opacity:.25;mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent)}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-content:center;gap:16px;text-align:center;background:#090911;transition:.55s}.done{visibility:hidden!important;opacity:0!important}.load-logo{width:74px;height:74px;display:grid;place-items:center;margin:auto;border-radius:20px;font-size:27px;font-weight:700;background:linear-gradient(135deg,#513084,#1a7782);box-shadow:0 0 30px rgba(93,60,150,.35);animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 20px rgba(93,60,150,0)}}.load-text{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.scene{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;perspective:1300px;padding:42px 16px}.card{width:100%;max-width:470px;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:30px;background:linear-gradient(155deg,rgba(255,255,255,.10),rgba(255,255,255,.025));backdrop-filter:blur(18px);box-shadow:0 30px 85px rgba(0,0,0,.6);will-change:transform}.glare{position:absolute;inset:0;z-index:5;opacity:0;pointer-events:none;transition:.25s}
.banner{height:160px;position:relative;overflow:hidden;background:linear-gradient(120deg,#1a1031,#0b1d29 50%,#281027)}.banner img{width:100%;height:100%;object-fit:cover;animation:bannerZoom 30s ease-in-out infinite alternate}@keyframes bannerZoom{to{transform:scale(1.07)}}.fallback span{position:absolute;border-radius:50%;filter:blur(35px);opacity:.75}.fallback span:nth-child(1){height:160px;width:160px;background:#6841a5;top:-60px;left:10%}.fallback span:nth-child(2){height:120px;width:120px;background:#137987;bottom:-60px;right:15%}.banner:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(9,9,17,.6))}.hide{display:none!important}
.avatar-zone{position:relative;z-index:6;display:flex;justify-content:center;margin-top:-58px}.avatar-ring{position:relative;width:116px;height:116px;border-radius:50%;cursor:pointer;transform-style:preserve-3d;animation:avatarFloat 5s ease-in-out infinite}@keyframes avatarFloat{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-7px) rotateY(7deg)}}.avatar{position:absolute;inset:0;border:2px solid rgba(247,241,229,.78);border-radius:50%;overflow:hidden;background:#151522;box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 0 0 4px rgba(0,0,0,.2)}.avatar img{height:100%;width:100%;object-fit:cover;display:none}.avatar .letter{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#50318c,#187e8e);font:700 54px 'Cormorant Garamond',serif;color:#f7f1e5}.has-img img{display:block}.has-img .letter{display:none}.online{position:absolute;z-index:2;right:5px;bottom:7px;width:14px;height:14px;border:2px solid #0c0c16;border-radius:50%;background:#5eea9a;box-shadow:0 0 12px #5eea9a}.flip{animation:flip .85s cubic-bezier(.6,.05,.3,1)!important}@keyframes flip{to{transform:rotateY(360deg)}}
.content{position:relative;z-index:6;padding:18px 26px 28px;text-align:center}.name{font:700 43px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:1px;color:#f7f1e5;text-shadow:0 2px 0 rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.45)}.typing{min-height:26px;display:flex;justify-content:center;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}.caret{width:2px;height:17px;margin-left:3px;background:var(--c);animation:blink .8s step-end infinite}@keyframes blink{50%{opacity:0}}.pills,.skills,.socials{display:flex;justify-content:center;flex-wrap:wrap}.pills{gap:10px;margin:16px 0 6px}.pill{padding:8px 15px;border:1px solid var(--border);border-radius:999px;background:var(--glass);font-size:13px;color:var(--muted)}.mood{color:#fff;background:linear-gradient(135deg,rgba(87,51,149,.46),rgba(11,107,121,.42));animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.bio-box{position:relative;margin:16px 0 4px;padding:15px 16px 15px 20px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.045);text-align:left}.bio-box:before{position:absolute;content:'';left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(#7b55bd,#30a7b6)}.bio-label{margin-bottom:7px;color:#7ed4dc;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase}.bio{color:#d4d5e5;font-size:13.5px;line-height:1.75;white-space:pre-line}.skills{gap:8px;margin:16px 0 4px}.chip{padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--glass);color:#e2e1e8;font-size:12px;animation:enter .5s backwards;transition:.25s}.chip:hover{transform:translateY(-3px);border-color:#8565b8}@keyframes enter{from{opacity:0;transform:translateY(12px)}}.socials{gap:12px;margin:18px 0 6px}.social{height:46px;width:46px;display:grid;place-items:center;border:1px solid var(--border);border-radius:14px;background:var(--glass);color:#f7f1e5;font-size:19px;text-decoration:none;transition:.25s}.social:hover{transform:translateY(-5px);border-color:rgba(247,241,229,.45);box-shadow:0 10px 25px rgba(0,0,0,.38),0 0 17px var(--glow)}.pin{display:none;width:max-content;align-items:center;gap:10px;margin:15px auto 0;padding:11px 21px;border-radius:999px;background:linear-gradient(135deg,#bd0926,#e43250);color:#fff;font-size:13px;font-weight:600;text-decoration:none;box-shadow:0 10px 25px rgba(180,0,30,.25);transition:.25s}.pin.show{display:flex}.pin:hover{transform:translateY(-3px)}.music{position:fixed;right:18px;bottom:18px;z-index:30;width:52px;height:52px;border:1px solid var(--border);border-radius:50%;background:rgba(20,20,40,.75);color:#fff;font-size:21px;cursor:pointer;backdrop-filter:blur(10px)}.music.play{animation:musicBeat 1s ease-in-out infinite}@keyframes musicBeat{50%{transform:scale(1.1)}}
@media(max-width:430px){.name{font-size:37px}.content{padding:17px 18px 26px}.banner{height:140px}.avatar-ring{width:105px;height:105px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ambient"><div class="glow one"></div><div class="glow two"></div><div class="dust"></div></div>
<div id="loader"><div class="load-logo">A4</div><div class="load-text">Loading profile</div></div>
<div class="scene"><main class="card" id="card"><div class="glare" id="glare"></div><div class="banner"><img id="bannerImg" class="hide" alt="Banner"><div class="fallback" id="fallback"><span></span><span></span></div></div><div class="avatar-zone"><div class="avatar-ring" id="avatarRing"><div class="avatar" id="avatar"><img id="avatarImg" alt="Profile picture"><div class="letter" id="letter">A</div></div><span class="online"></span></div></div><div class="content"><h1 class="name" id="name">Arun4ever</h1><div class="typing"><span id="typing"></span><span class="caret"></span></div><div class="pills"><span class="pill mood" id="mood">😎 Creative</span><span class="pill" id="location">📍 Ahmedabad, India</span></div><div class="bio-box"><div class="bio-label">About me</div><p class="bio" id="bio"></p></div><div class="skills" id="skills"></div><div class="socials" id="socials"></div><a class="pin" id="pin" target="_blank" rel="noopener"><i class="fa-brands fa-pinterest"></i> Follow on Pinterest</a></div></main></div>
<button class="music hide" id="music">♪</button><audio id="audio" loop preload="none"></audio>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
(()=>{const $=x=>document.getElementById(x),def={name:'Arun4ever',taglines:['Creative Web Developer','Building websites with style','A personal corner of the web'],bio:'Welcome to my corner of the internet. I enjoy creating thoughtful websites, animations and digital experiences.',mood:'Creative',moodEmoji:'😎',location:'Ahmedabad, India 🇮🇳',avatar:'',banner:'',music:'',skills:'HTML, CSS, JavaScript, Firebase, Web Design',socials:{pinterest:'',instagram:'',github:'',youtube:'',whatsapp:'',telegram:'',twitter:'',email:'',website:''}},icons={pinterest:['fa-brands fa-pinterest','Pinterest','#e60023'],instagram:['fa-brands fa-instagram','Instagram','#e1306c'],github:['fa-brands fa-github','GitHub','#a78bfa'],youtube:['fa-brands fa-youtube','YouTube','#f00'],whatsapp:['fa-brands fa-whatsapp','WhatsApp','#25d366'],telegram:['fa-brands fa-telegram','Telegram','#229ed9'],twitter:['fa-brands fa-x-twitter','X','#fff'],email:['fa-solid fa-envelope','Email','#f59e0b'],website:['fa-solid fa-globe','Website','#22d3ee']};let lines=def.taglines,li=0,ci=0,erase=false,started=false;const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),http=x=>/^https?:\/\//i.test(x)?x:'https://'+x,href=(k,x)=>k==='email'?'mailto:'+x:k==='whatsapp'&&/^\+?\d[\d -]+$/.test(x)?'https://wa.me/'+x.replace(/\D/g,''):http(x);function type(){let word=String(lines[li%lines.length]||'');if(!erase){ci++;$('typing').textContent=word.slice(0,ci);if(ci>=word.length){erase=true;return setTimeout(type,1800)}setTimeout(type,70)}else{ci--;$('typing').textContent=word.slice(0,ci);if(ci<=0){erase=false;li++;return setTimeout(type,400)}setTimeout(type,35)}}function start(){if(!started){started=true;type()}}function render(value){let p=Object.assign({},def,value||{});p.socials=Object.assign({},def.socials,(value&&value.socials)||{});lines=Array.isArray(p.taglines)&&p.taglines.length?p.taglines:def.taglines;document.title=p.name+' | Profile';$('name').textContent=p.name;$('letter').textContent=(p.name.trim()[0]||'A').toUpperCase();if(p.avatar){$('avatarImg').src=p.avatar;$('avatar').classList.add('has-img')}else $('avatar').classList.remove('has-img');if(p.banner){$('bannerImg').src=p.banner;$('bannerImg').classList.remove('hide');$('fallback').classList.add('hide')}else{$('bannerImg').classList.add('hide');$('fallback').classList.remove('hide')}$('mood').textContent=((p.moodEmoji||'')+' '+(p.mood||'')).trim()||'😎 Creative';$('location').textContent='📍 '+(p.location||'Somewhere on Earth');$('bio').textContent=p.bio||'';$('skills').innerHTML=String(p.skills||'').split(',').map(x=>x.trim()).filter(Boolean).map((x,i)=>'<span class="chip" style="animation-delay:'+i*80+'ms">'+esc(x)+'</span>').join('');let out='';Object.keys(icons).forEach(k=>{let x=String(p.socials[k]||'').trim();if(!x)return;let a=icons[k];out+='<a class="social" style="--glow:'+a[2]+'" href="'+esc(href(k,x))+'" target="_blank" rel="noopener" title="'+a[1]+'"><i class="'+a[0]+'"></i></a>'});$('socials').innerHTML=out;let pin=String(p.socials.pinterest||'').trim();if(pin){$('pin').href=http(pin);$('pin').classList.add('show')}else $('pin').classList.remove('show');let audio=$('audio');if(p.music){audio.src=p.music;$('music').classList.remove('hide')}else{$('music').classList.add('hide');audio.pause()}start()}$('avatarRing').onclick=function(){this.classList.remove('flip');void this.offsetWidth;this.classList.add('flip')};let playing=false;$('music').onclick=()=>{let a=$('audio');playing?a.pause():a.play().catch(()=>{});playing=!playing;$('music').classList.toggle('play',playing)};let card=$('card'),glare=$('glare'),rx=0,ry=0,tx=0,ty=0;if(matchMedia('(pointer:fine)').matches){card.onpointermove=e=>{let r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;ty=(x-.5)*10;tx=-(y-.5)*8;glare.style.opacity='.35';glare.style.background='radial-gradient(circle at '+x*100+'% '+y*100+'%,rgba(255,255,255,.2),transparent 56%)'};card.onpointerleave=()=>{tx=ty=0;glare.style.opacity=0}}(function tilt(){rx+=(tx-rx)*.09;ry+=(ty-ry)*.09;card.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';requestAnimationFrame(tilt)})();let done=()=>$('loader').classList.add('done');if(window.IS_CONFIGURED&&window.firebase){firebase.database().ref('profile').on('value',s=>{render(s.val());done()},()=>{render(null);done()})}else render(null);addEventListener('load',()=>setTimeout(done,400));setTimeout(done,2200)})();
</script>
</body>
</html>
