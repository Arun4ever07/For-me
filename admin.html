<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arun4ever Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#111217;--card:#1a1b22;--line:#32343f;--muted:#aaaab5;--blue:#7f91ff}body{background:var(--bg);color:#f4f3f8;font:13px Poppins,sans-serif}.hide{display:none!important}.wrap{max-width:950px;margin:auto;padding:28px 16px 100px}.login{width:min(100%,400px);margin:10vh auto;padding:30px;border:1px solid var(--line);border-radius:14px;background:var(--card)}h1{font:700 35px/1 'Cormorant Garamond',serif}.sub{margin:8px 0 18px;color:var(--muted);font-size:11px}.input,.text,select{width:100%;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:7px;background:#12131a;color:#fff;font:12px Poppins,sans-serif;outline:none}.text{min-height:75px;resize:vertical}.input:focus,.text:focus,select:focus{border-color:var(--blue)}.btn{margin-top:13px;padding:10px 14px;border:0;border-radius:7px;background:var(--blue);color:#fff;font:600 11px Poppins,sans-serif;cursor:pointer}.err{margin-top:9px;color:#ff9ba4;font-size:11px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.head a,.out{padding:9px 11px;border:1px solid var(--line);border-radius:6px;color:#fff;background:transparent;font:11px Poppins,sans-serif;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.box{padding:18px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.box.full{grid-column:1/-1}.box h2{font:700 22px 'Cormorant Garamond',serif}.label{display:block;margin-top:12px;color:var(--muted);font-size:10px}.work{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:8px;background:#14151b}.work-head{display:flex;justify-content:space-between;align-items:center;font-size:11px}.remove{border:0;background:transparent;color:#ff9ba4;cursor:pointer;font:11px Poppins,sans-serif}.add{background:#30334a}.savebar{position:fixed;bottom:0;left:0;right:0;padding:13px;background:#111217eF;border-top:1px solid var(--line);text-align:center}.savebar .btn{width:min(330px,90%);margin:0}.ok{position:fixed;right:15px;bottom:75px;padding:10px 13px;border-radius:7px;background:#22764f;color:#fff;font-size:11px;opacity:0;transition:.3s}.ok.show{opacity:1}@media(max-width:650px){.grid{grid-template-columns:1fr}.box.full{grid-column:auto}}</style></head><body><div class="wrap"><section id="login" class="login"><h1>Arun4ever Admin</h1><p class="sub">Manage profile, design and work cards.</p><input id="email" class="input" type="email" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn">Login</button><p id="err" class="err"></p></section><section id="app" class="hide"><div class="head"><div><h1>Profile studio</h1><p class="sub">All changes update your public website live.</p></div><div><a href="index.html" target="_blank">View site</a> <button id="logout" class="out">Logout</button></div></div><div class="grid"><div class="box"><h2>Identity</h2><label class="label">Website / profile name</label><input id="name" class="input"><label class="label">Tagline</label><input id="tagline" class="input"><label class="label">Mood</label><input id="mood" class="input"><label class="label">Mood emoji</label><input id="emoji" class="input"><label class="label">Location</label><input id="location" class="input"></div><div class="box"><h2>Look & media</h2><label class="label">Profile image direct URL</label><input id="avatar" class="input"><label class="label">Banner GIF/image direct URL</label><input id="banner" class="input"><label class="label">Music direct MP3 URL</label><input id="music" class="input"><label class="label">Profile layout theme</label><select id="theme"><option value="classic">Classic ivory</option><option value="default">Default dark</option></select><label class="label">Skills, separated by commas</label><input id="skills" class="input"></div><div class="box full"><h2>Profile text</h2><label class="label">About me</label><textarea id="bio" class="text"></textarea><label class="label">Small text below bio</label><textarea id="profileText" class="text"></textarea><label class="label">Work section title</label><input id="workTitle" class="input"><label class="label">Work section subtitle</label><textarea id="workText" class="text"></textarea></div><div class="box full"><h2>Work cards</h2><p class="sub">Add project image URL, project caption and direct project link.</p><div id="workList"></div><button id="addWork" class="btn add">+ Add work card</button></div><div class="box full"><h2>Social links</h2><div class="grid"><div><label class="label">Pinterest</label><input id="pinterest" class="input"><label class="label">Instagram</label><input id="instagram" class="input"><label class="label">GitHub</label><input id="github" class="input"><label class="label">YouTube</label><input id="youtube" class="input"><label class="label">Website</label><input id="website" class="input"></div><div><label class="label">WhatsApp number/link</label><input id="whatsapp" class="input"><label class="label">Telegram</label><input id="telegram" class="input"><label class="label">X / Twitter</label><input id="twitter" class="input"><label class="label">Email</label><input id="mail" class="input"></div></div></div></div></section></div><div class="savebar"><button id="save" class="btn">Save all changes</button></div><div id="ok" class="ok">Saved successfully ✓</div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),fields=['name','tagline','mood','emoji','location','avatar','banner','music','theme','skills','bio','profileText','workTitle','workText','pinterest','instagram','github','youtube','website','whatsapp','telegram','twitter','mail'];let works=[];function workCard(w={}){let n=works.length;return '<div class="work" data-i="'+n+'"><div class="work-head"><b>Work card '+(n+1)+'</b><button class="remove" type="button">Remove</button></div><label class="label">Project title</label><input class="input wt" value="'+(w.title||'').replace(/"/g,'&quot;')+'"><label class="label">Image direct URL</label><input class="input wi" value="'+(w.image||'').replace(/"/g,'&quot;')+'"><label class="label">Caption</label><textarea class="text wc">'+(w.caption||'')+'</textarea><label class="label">Direct project link</label><input class="input wl" value="'+(w.link||'').replace(/"/g,'&quot;')+'"></div>'}function draw(){let box=$('workList');box.innerHTML=works.map(workCard).join('');box.querySelectorAll('.remove').forEach((b,i)=>b.onclick=()=>{works.splice(i,1);draw()})}$('addWork').onclick=()=>{works.push({});draw()};function set(id,v){$(id).value=v||''}function load(){firebase.database().ref('profile').on('value',s=>{let p=s.val()||{},so=p.socials||{};set('name',p.name);set('tagline',(p.taglines||[])[0]);set('mood',p.mood);set('emoji',p.moodEmoji);set('location',p.location);set('avatar',p.avatar);set('banner',p.banner);set('music',p.music);set('theme',p.theme||'classic');set('skills',p.skills);set('bio',p.bio);set('profileText',p.profileText);set('workTitle',p.workTitle);set('workText',p.workText);['pinterest','instagram','github','youtube','website','whatsapp','telegram','twitter'].forEach(x=>set(x,so[x]));set('mail',so.email);works=Array.isArray(p.works)?p.works:[];draw()})}function login(){firebase.auth().signInWithEmailAndPassword($('email').value.trim(),$('pass').value).catch(e=>$('err').textContent=e.message)}$('loginBtn').onclick=login;$('pass').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>firebase.auth().signOut();firebase.auth().onAuthStateChanged(u=>{if(u){$('login').classList.add('hide');$('app').classList.remove('hide');load()}else{$('app').classList.add('hide');$('login').classList.remove('hide')}});$('save').onclick=async()=>{let nodes=[...document.querySelectorAll('.work')],newWorks=nodes.map(x=>({title:x.querySelector('.wt').value.trim(),image:x.querySelector('.wi').value.trim(),caption:x.querySelector('.wc').value.trim(),link:x.querySelector('.wl').value.trim()})).filter(x=>x.title);let p={name:$('name').value.trim()||'Arun4ever',taglines:[$('tagline').value.trim()||'Creative Web Developer'],mood:$('mood').value.trim(),moodEmoji:$('emoji').value.trim(),location:$('location').value.trim(),avatar:$('avatar').value.trim(),banner:$('banner').value.trim(),music:$('music').value.trim(),theme:$('theme').value,skills:$('skills').value.trim(),bio:$('bio').value.trim(),profileText:$('profileText').value.trim(),workTitle:$('workTitle').value.trim(),workText:$('workText').value.trim(),works:newWorks,socials:{pinterest:$('pinterest').value.trim(),instagram:$('instagram').value.trim(),github:$('github').value.trim(),youtube:$('youtube').value.trim(),website:$('website').value.trim(),whatsapp:$('whatsapp').value.trim(),telegram:$('telegram').value.trim(),twitter:$('twitter').value.trim(),email:$('mail').value.trim()}};try{await firebase.database().ref('profile').set(p);$('ok').classList.add('show');setTimeout(()=>$('ok').classList.remove('show'),2200)}catch(e){alert('Save failed: '+e.message)}};if(!window.IS_CONFIGURED)$('err').textContent='Firebase config is not connected.'})();
</script></body></html>
